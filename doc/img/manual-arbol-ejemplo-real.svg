<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Filtros de Sombra -->
    <filter id="shadow-node" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="shadow-root" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-connector" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="shadow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Gradientes -->
    <linearGradient id="grad-root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="grad-marketing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="grad-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="grad-ux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="grad-legal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="grad-node-sub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Patrón de Puntos de Fondo -->
    <pattern id="bg-grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
    </pattern>

    <!-- Marcador Flecha para Conector -->
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Lienzo de Fondo -->
  <rect width="1200" height="800" fill="#090d16" />
  <rect width="1200" height="800" fill="url(#bg-grid-dots)" />

  <!-- Cabecera Informativa -->
  <rect x="30" y="20" width="1140" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="55" cy="46" r="10" fill="#6366f1" />
  <text x="55" y="50" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">★</text>
  <text x="75" y="44" font-size="15" font-weight="700" fill="#ffffff">Ejemplo Práctico Real: Mapa de Lanzamiento de Producto (SaaS Q4)</text>
  <text x="75" y="60" font-size="11.5" fill="#94a3b8">Visualización de jerarquías, barras de progreso, etiquetas semánticas (#tags), notas markdown, nubes y conectores libres</text>
  <rect x="1030" y="32" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="1092" y="49" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Layout: Bilateral</text>

  <!-- ======================================================== -->
  <!-- NUBE DE AGRUPACIÓN (Marketing Branch) -->
  <!-- ======================================================== -->
  <g id="cloud-marketing">
    <!-- Forma envolvente de nube translúcida -->
    <path d="M 12 120 C 12 90, 45 75, 80 85 C 115 65, 175 60, 220 80 C 265 65, 345 75, 365 110 C 395 125, 415 160, 410 205 C 418 245, 395 295, 365 320 C 335 350, 260 355, 220 340 C 175 355, 105 350, 70 330 C 25 330, 8 285, 15 240 C 5 195, 8 150, 12 120 Z"
          fill="#059669" fill-opacity="0.08" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6,4" />
    <!-- Etiqueta de la nube -->
    <rect x="25" y="90" width="130" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="90" y="105" font-size="10.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">☁️ Sprint Marketing</text>
  </g>

  <!-- ======================================================== -->
  <!-- ARISTAS / CONEXIONES PRINCIPALES (Curvas Bézier) -->
  <!-- ======================================================== -->
  <g id="branch-edges" stroke-linecap="round" fill="none">
    <!-- Raíz a Marketing (Izquierda Arriba) -->
    <path d="M 500 400 C 400 400, 360 215, 270 215" stroke="#10b981" stroke-width="3.5" />
    <!-- Marketing a Subnodos -->
    <path d="M 170 215 C 130 215, 120 155, 60 155" stroke="#059669" stroke-width="2" />
    <path d="M 170 215 C 130 215, 120 275, 60 275" stroke="#059669" stroke-width="2" />

    <!-- Raíz a Legal (Izquierda Abajo) -->
    <path d="M 500 400 C 400 400, 370 595, 275 595" stroke="#8b5cf6" stroke-width="3" />
    <!-- Legal a Subnodo -->
    <path d="M 175 595 C 130 595, 120 595, 65 595" stroke="#7c3aed" stroke-width="2" />

    <!-- Raíz a Desarrollo (Derecha Arriba) -->
    <path d="M 700 400 C 800 400, 840 220, 930 220" stroke="#0ea5e9" stroke-width="3.5" />
    <!-- Desarrollo a Subnodos -->
    <path d="M 1030 220 C 1070 220, 1085 155, 1140 155" stroke="#0284c7" stroke-width="2" />
    <path d="M 1030 220 C 1070 220, 1085 285, 1140 285" stroke="#0284c7" stroke-width="2" />

    <!-- Raíz a UX/UI (Derecha Abajo) -->
    <path d="M 700 400 C 800 400, 845 585, 935 585" stroke="#f59e0b" stroke-width="3" />
    <!-- UX/UI a Subnodos -->
    <path d="M 1035 585 C 1075 585, 1085 530, 1140 530" stroke="#d97706" stroke-width="2" />
    <path d="M 1035 585 C 1075 585, 1085 640, 1140 640" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- ======================================================== -->
  <!-- CONECTOR LIBRE TRANSVERSAL (Stripe -> Webinar) -->
  <!-- ======================================================== -->
  <g id="free-connector">
    <!-- Trazo curvo que cruza con flecha y glow -->
    <path d="M 1010 270 C 850 60, 350 70, 195 260"
          stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7,4" fill="none"
          marker-end="url(#arrow-pink)" filter="url(#glow-connector)" />
    
    <!-- Etiqueta sobre el conector -->
    <g transform="translate(530, 86)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow-badge)" />
      <text x="85" y="17" font-size="10.5" font-weight="700" fill="#fecdd3" text-anchor="middle">🔗 Sincroniza Pagos Stripe</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- NODO CENTRAL / RAÍZ -->
  <!-- ======================================================== -->
  <g id="node-root" transform="translate(485, 360)">
    <rect x="0" y="0" width="230" height="80" rx="16" fill="url(#grad-root)" stroke="#818cf8" stroke-width="2" filter="url(#shadow-root)" />
    <!-- Emoji / Icono -->
    <circle cx="34" cy="40" r="18" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <text x="34" y="47" font-size="20" text-anchor="middle">🚀</text>
    <!-- Texto principal -->
    <text x="64" y="36" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.3">Lanzamiento SaaS Q4</text>
    <text x="64" y="55" font-size="11" font-weight="500" fill="#c7d2fe">Estrategia Global de Mercado</text>
    <!-- Badge de estado -->
    <rect x="64" y="61" width="70" height="13" rx="3" fill="#312e81" />
    <text x="99" y="71" font-size="8.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">PRIORIDAD ALTA</text>
  </g>

  <!-- ======================================================== -->
  <!-- RAMA 1: MARKETING & GROWTH (Forma Burbuja con Colita) -->
  <!-- ======================================================== -->
  <g id="node-marketing" transform="translate(170, 175)">
    <!-- Burbuja con colita hacia la derecha (apunta al padre) -->
    <path d="M 12 0 L 188 0 Q 200 0 200 12 L 200 32 L 216 40 L 200 48 L 200 68 Q 200 80 188 80 L 12 80 Q 0 80 0 68 L 0 12 Q 0 0 12 0 Z"
          fill="url(#grad-marketing)" stroke="#34d399" stroke-width="1.8" filter="url(#shadow-node)" />
    <!-- Título e icono -->
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#ffffff">📣 Marketing &amp; Growth</text>
    <!-- Tags -->
    <rect x="16" y="34" width="62" height="16" rx="4" fill="#064e3b" />
    <text x="47" y="46" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">#marketing</text>
    <rect x="84" y="34" width="50" height="16" rx="4" fill="#064e3b" />
    <text x="109" y="46" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">#growth</text>
    <!-- Barra de Progreso 75% -->
    <text x="16" y="66" font-size="9" font-weight="600" fill="#a7f3d0">Progreso: 75%</text>
    <rect x="85" y="58" width="100" height="8" rx="4" fill="#064e3b" />
    <rect x="85" y="58" width="75" height="8" rx="4" fill="#10b981" />
  </g>

  <!-- Subnodos Marketing -->
  <!-- Subnodo 1.1: Ads -->
  <g id="node-mkt-ads" transform="translate(15, 130)">
    <rect x="0" y="0" width="150" height="48" rx="8" fill="url(#grad-node-sub)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-node)" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#f1f5f9">Campaña Google Ads</text>
    <rect x="12" y="30" width="45" height="12" rx="3" fill="#1e3a5f" />
    <text x="34" y="39" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle">#adwords</text>
    <!-- Mini progress 100% -->
    <circle cx="134" cy="24" r="7" fill="#10b981" />
    <text x="134" y="27" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text>
  </g>

  <!-- Subnodo 1.2: Webinar -->
  <g id="node-mkt-webinar" transform="translate(15, 250)">
    <rect x="0" y="0" width="155" height="52" rx="8" fill="url(#grad-node-sub)" stroke="#10b981" stroke-width="1.4" filter="url(#shadow-node)" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#f1f5f9">Webinar en Vivo &amp; Demo</text>
    <!-- Enlace Web Badge -->
    <rect x="12" y="30" width="62" height="14" rx="3" fill="#064e3b" />
    <text x="43" y="41" font-size="8" font-weight="600" fill="#6ee7b7" text-anchor="middle">🔗 meet.com/q4</text>
    <rect x="80" y="30" width="30" height="14" rx="3" fill="#1e293b" />
    <text x="95" y="41" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">45%</text>
  </g>

  <!-- ======================================================== -->
  <!-- RAMA 2: PRODUCTO & BACKEND (Rectángulo con Sombra 3D) -->
  <!-- ======================================================== -->
  <g id="node-dev" transform="translate(830, 180)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#grad-dev)" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow-node)" />
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#ffffff">⚙️ Producto &amp; Backend</text>
    <!-- Tags -->
    <rect x="16" y="34" width="55" height="16" rx="4" fill="#0c4a6e" />
    <text x="43" y="46" font-size="9" font-weight="600" fill="#7dd3fc" text-anchor="middle">#urgente</text>
    <rect x="76" y="34" width="40" height="16" rx="4" fill="#0c4a6e" />
    <text x="96" y="46" font-size="9" font-weight="600" fill="#7dd3fc" text-anchor="middle">#dev</text>
    <!-- Barra de Progreso 90% -->
    <text x="16" y="66" font-size="9" font-weight="600" fill="#bae6fd">Progreso: 90%</text>
    <rect x="85" y="58" width="100" height="8" rx="4" fill="#0c4a6e" />
    <rect x="85" y="58" width="90" height="8" rx="4" fill="#38bdf8" />
  </g>

  <!-- Subnodos Dev -->
  <!-- Subnodo 2.1: API Gateway -->
  <g id="node-dev-api" transform="translate(1040, 130)">
    <rect x="0" y="0" width="145" height="48" rx="8" fill="url(#grad-node-sub)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-node)" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#f1f5f9">API Gateway &amp; Auth</text>
    <circle cx="128" cy="24" r="7" fill="#10b981" />
    <text x="128" y="27" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="12" y="38" font-size="8.5" fill="#94a3b8">GraphQL + JWT</text>
  </g>

  <!-- Subnodo 2.2: Pasarela Stripe (Con Nota Markdown) -->
  <g id="node-dev-stripe" transform="translate(1040, 260)">
    <rect x="0" y="0" width="150" height="52" rx="8" fill="url(#grad-node-sub)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow-node)" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#f1f5f9">Pasarela Stripe</text>
    <!-- Indicador de Nota Markdown -->
    <rect x="12" y="30" width="60" height="14" rx="3" fill="#1e3a5f" />
    <text x="42" y="41" font-size="8.5" font-weight="600" fill="#38bdf8" text-anchor="middle">📝 Con Nota</text>
    <circle cx="132" cy="26" r="7" fill="#0ea5e9" />
    <text x="132" y="29" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">85%</text>
  </g>

  <!-- ======================================================== -->
  <!-- RAMA 3: OPERACIONES & LEGAL (Hexágono / Púrpura) -->
  <!-- ======================================================== -->
  <g id="node-legal" transform="translate(180, 560)">
    <rect x="0" y="0" width="190" height="72" rx="12" fill="url(#grad-legal)" stroke="#a78bfa" stroke-width="1.6" filter="url(#shadow-node)" />
    <text x="16" y="25" font-size="13" font-weight="700" fill="#ffffff">⚖️ Cumplimiento &amp; Legal</text>
    <rect x="16" y="32" width="46" height="15" rx="3" fill="#4c1d95" />
    <text x="39" y="43" font-size="8.5" font-weight="600" fill="#c4b5fd" text-anchor="middle">#legal</text>
    <!-- Progreso 30% -->
    <text x="16" y="58" font-size="8.5" font-weight="600" fill="#ddd6fe">Progreso: 30%</text>
    <rect x="80" y="52" width="95" height="7" rx="3.5" fill="#4c1d95" />
    <rect x="80" y="52" width="28" height="7" rx="3.5" fill="#a78bfa" />
  </g>

  <!-- Subnodo Legal -->
  <g id="node-legal-rgpd" transform="translate(15, 570)">
    <rect x="0" y="0" width="150" height="48" rx="8" fill="url(#grad-node-sub)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-node)" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#f1f5f9">Auditoría RGPD &amp; SOC2</text>
    <text x="12" y="38" font-size="8.5" fill="#f87171">Pendiente firma DPO</text>
  </g>

  <!-- ======================================================== -->
  <!-- RAMA 4: EXPERIENCIA & UI/UX (Ámbar / Naranja) -->
  <!-- ======================================================== -->
  <g id="node-ux" transform="translate(835, 550)">
    <rect x="0" y="0" width="200" height="74" rx="10" fill="url(#grad-ux)" stroke="#fbbf24" stroke-width="1.6" filter="url(#shadow-node)" />
    <text x="16" y="25" font-size="13" font-weight="700" fill="#ffffff">🎨 Experiencia &amp; UI/UX</text>
    <rect x="16" y="33" width="42" height="15" rx="3" fill="#78350f" />
    <text x="37" y="44" font-size="8.5" font-weight="600" fill="#fde68a" text-anchor="middle">#ux</text>
    <rect x="63" y="33" width="48" height="15" rx="3" fill="#78350f" />
    <text x="87" y="44" font-size="8.5" font-weight="600" fill="#fde68a" text-anchor="middle">#mobile</text>
    <!-- Progreso 60% -->
    <text x="16" y="60" font-size="8.5" font-weight="600" fill="#fef3c7">Progreso: 60%</text>
    <rect x="82" y="53" width="102" height="7" rx="3.5" fill="#78350f" />
    <rect x="82" y="53" width="61" height="7" rx="3.5" fill="#fbbf24" />
  </g>

  <!-- Subnodos UX -->
  <g id="node-ux-onboard" transform="translate(1040, 510)">
    <rect x="0" y="0" width="145" height="42" rx="8" fill="url(#grad-node-sub)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-node)" />
    <text x="12" y="25" font-size="10.5" font-weight="600" fill="#f1f5f9">Onboarding Mobile</text>
  </g>
  <g id="node-ux-test" transform="translate(1040, 620)">
    <rect x="0" y="0" width="145" height="42" rx="8" fill="url(#grad-node-sub)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-node)" />
    <text x="12" y="25" font-size="10.5" font-weight="600" fill="#f1f5f9">Pruebas A/B Figma</text>
  </g>

  <!-- ======================================================== -->
  <!-- PIE CON LEYENDA Y LLAMADAS EXPLICATIVAS (ANOTACIONES) -->
  <!-- ======================================================== -->
  <g id="annotations" transform="translate(30, 715)">
    <rect x="0" y="0" width="1140" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Item 1: Nube -->
    <g transform="translate(20, 15)">
      <circle cx="12" cy="16" r="10" fill="#059669" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="30" y="14" font-size="11" font-weight="700" fill="#ffffff">Nube Envolvente</text>
      <text x="30" y="28" font-size="9.5" fill="#94a3b8">Agrupa subárbol temático</text>
    </g>

    <!-- Item 2: Conector Libre -->
    <g transform="translate(240, 15)">
      <circle cx="12" cy="16" r="10" fill="#f43f5e" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="30" y="14" font-size="11" font-weight="700" fill="#ffffff">Conector Transversal</text>
      <text x="30" y="28" font-size="9.5" fill="#94a3b8">Relación con badge y flecha</text>
    </g>

    <!-- Item 3: Colita Bocadillo -->
    <g transform="translate(470, 15)">
      <circle cx="12" cy="16" r="10" fill="#10b981" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="30" y="14" font-size="11" font-weight="700" fill="#ffffff">Forma Bocadillo (Bubble)</text>
      <text x="30" y="28" font-size="9.5" fill="#94a3b8">Colita anatómica orientable</text>
    </g>

    <!-- Item 4: Metadatos (#tags y %) -->
    <g transform="translate(710, 15)">
      <circle cx="12" cy="16" r="10" fill="#38bdf8" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="30" y="14" font-size="11" font-weight="700" fill="#ffffff">Metadatos Enriquecidos</text>
      <text x="30" y="28" font-size="9.5" fill="#94a3b8">Barras de progreso y #tags</text>
    </g>

    <!-- Item 5: Notas Markdown -->
    <g transform="translate(950, 15)">
      <circle cx="12" cy="16" r="10" fill="#818cf8" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
      <text x="30" y="14" font-size="11" font-weight="700" fill="#ffffff">Notas y Enlaces</text>
      <text x="30" y="28" font-size="9.5" fill="#94a3b8">Documentación inline</text>
    </g>
  </g>
</svg>