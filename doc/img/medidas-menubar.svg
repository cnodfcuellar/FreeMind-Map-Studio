<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
      .name { font-size:12px; font-weight:800; }
    </style>
  </defs>

  <rect width="1180" height="640" rx="16" fill="#0f172a"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">MenuBar — Medidas detalladas</text>
  <text x="32" y="62" font-size="12.5" fill="#93c5fd">Escala 1:1 (1px = 1px real) · MenuBar.tsx:137-556 · h-10 = 40px · px-3 = 12px</text>

  <!-- ===================== BARRA (escala 1:1) =====================
       x:100..1040 (ancho 940px) · y:100..140 (alto 40px) -->
  <rect x="100" y="100" width="940" height="40" rx="6" fill="#0f172a" stroke="#334155"/>

  <!-- Brand -->
  <rect x="112" y="108" width="24" height="24" rx="5" fill="#1e293b"/>
  <text x="124" y="125" font-size="14" text-anchor="middle" fill="#ffffff">🧠</text>
  <text x="144" y="124" class="name" fill="#f1f5f9" font-size="12">FreeMind Map Studio</text>

  <!-- 6 botones de menu -->
  <g font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="600">
    <rect x="292" y="106" width="56" height="28" rx="5" fill="#1e293b"/><text x="320" y="124">Archivo</text>
    <rect x="354" y="106" width="52" height="28" rx="5" fill="#1e293b"/><text x="380" y="124">Editar</text>
    <rect x="412" y="106" width="58" height="28" rx="5" fill="#1e293b"/><text x="441" y="124">Insertar</text>
    <rect x="476" y="106" width="58" height="28" rx="5" fill="#1e293b"/><text x="505" y="124">Formato</text>
    <rect x="540" y="106" width="42" height="28" rx="5" fill="#1e293b"/><text x="561" y="124">Ver</text>
    <rect x="588" y="106" width="50" height="28" rx="5" fill="#1e293b"/><text x="613" y="124">Ayuda</text>
  </g>

  <!-- Titulo central editable (flex-1 max-w-sm = 384px) -->
  <rect x="700" y="108" width="240" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="820" y="124" font-size="10.5" text-anchor="middle" fill="#94a3b8">Título del mapa (doble clic)</text>

  <!-- Derecha: badge offline + tema -->
  <rect x="952" y="110" width="8" height="8" rx="4" fill="#34d399"/>
  <text x="966" y="124" font-size="10" fill="#34d399">100% Offline</text>
  <rect x="1012" y="106" width="24" height="28" rx="5" fill="#1e293b"/>
  <text x="1024" y="124" font-size="12" text-anchor="middle" fill="#cbd5e1">☀</text>

  <!-- COTA ALTURA (x=72) -->
  <line x1="74" y1="100" x2="74" y2="140" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="68" y="124" class="cota-txt" text-anchor="end">40px</text>
  <text x="68" y="136" font-size="9" text-anchor="end" fill="#b45309">h-10</text>

  <!-- Padding lateral px-3 (12px) -->
  <line x1="100" y1="152" x2="112" y2="152" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="106" y="166" class="cota-txt" font-size="9" text-anchor="middle">12px</text>
  <text x="106" y="178" font-size="8.5" text-anchor="middle" fill="#b45309">px-3</text>

  <!-- Gap entre marca y menus (gap-2 = 8px) -->
  <line x1="270" y1="152" x2="292" y2="152" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="281" y="166" class="cota-txt" font-size="9" text-anchor="middle">8px</text>
  <text x="281" y="178" font-size="8.5" text-anchor="middle" fill="#b45309">gap-2</text>

  <!-- Padding boton menu px-2.5 (10px) + py-1 (4px) -->
  <line x1="292" y1="192" x2="302" y2="192" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="297" y="206" class="cota-txt" font-size="9" text-anchor="middle">10px</text>
  <text x="297" y="218" font-size="8.5" text-anchor="middle" fill="#b45309">px-2.5</text>

  <!-- DESGLOSE: ancho de cada boton -->
  <text x="112" y="238" class="lbl" fill="#93c5fd">Anchos de botón (px-2.5 = 10px por lado + texto)</text>
  <g class="cota">
    <line x1="292" y1="248" x2="348" y2="248"/><line x1="354" y1="248" x2="406" y2="248"/>
    <line x1="412" y1="248" x2="470" y2="248"/><line x1="476" y1="248" x2="534" y2="248"/>
    <line x1="540" y1="248" x2="582" y2="248"/><line x1="588" y1="248" x2="638" y2="248"/>
  </g>
  <g class="cota-txt" font-size="9.5" text-anchor="middle">
    <text x="320" y="262">56</text><text x="380" y="262">52</text><text x="441" y="262">58</text>
    <text x="505" y="262">58</text><text x="561" y="262">42</text><text x="613" y="262">50</text>
  </g>

  <!-- DESGLOSE: dropdown Archivo (w-56 = 224px) -->
  <text x="112" y="296" class="lbl" fill="#93c5fd">Dropdowns (ancho fijo)</text>

  <!-- Archivo -->
  <rect x="112" y="308" width="224" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="224" y="326" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Archivo · w-56</text>
  <line x1="124" y1="334" x2="324" y2="334" stroke="#e2e8f0"/>
  <g font-size="9.5" fill="#334155">
    <text x="128" y="350">Nuevo Mapa</text>
    <text x="128" y="368">Plantillas de Ejemplo</text>
    <text x="128" y="386">Mis Mapas Guardados</text>
    <line x1="124" y1="394" x2="324" y2="394" stroke="#e2e8f0"/>
    <text x="128" y="410">Guardar Ahora <tspan fill="#94a3b8">Ctrl+S</tspan></text>
    <line x1="124" y1="418" x2="324" y2="418" stroke="#e2e8f0"/>
    <text x="128" y="434" fill="#2563eb" font-weight="700">Exportar (.mm / HTML)</text>
    <text x="128" y="452">Importar Freeplane (.mm)</text>
  </g>
  <text x="224" y="476" class="lbl-sm" text-anchor="middle">ítem: px-3 py-1.5 → alto 30px</text>

  <!-- Editar -->
  <rect x="360" y="308" width="208" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="464" y="326" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Editar · w-52</text>
  <line x1="372" y1="334" x2="556" y2="334" stroke="#e2e8f0"/>
  <g font-size="9.5" fill="#334155">
    <text x="376" y="350">Deshacer <tspan fill="#94a3b8">Ctrl+Z</tspan></text>
    <text x="376" y="368">Rehacer <tspan fill="#94a3b8">Ctrl+Y</tspan></text>
    <line x1="372" y1="374" x2="556" y2="374" stroke="#e2e8f0"/>
    <text x="376" y="390" fill="#dc2626">Eliminar Rama <tspan fill="#f87171">Supr</tspan></text>
  </g>

  <!-- Insertar -->
  <rect x="600" y="308" width="224" height="148" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="712" y="326" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Insertar · w-56</text>
  <line x1="612" y1="334" x2="812" y2="334" stroke="#e2e8f0"/>
  <g font-size="9.5" fill="#334155">
    <text x="616" y="350">Nodo Hijo <tspan fill="#94a3b8">Tab</tspan></text>
    <text x="616" y="368">Nodo Hermano <tspan fill="#94a3b8">Enter</tspan></text>
    <line x1="612" y1="374" x2="812" y2="374" stroke="#e2e8f0"/>
    <text x="616" y="390">Conector de Relación</text>
    <text x="616" y="408">Nube de Rama</text>
    <line x1="612" y1="414" x2="812" y2="414" stroke="#e2e8f0"/>
    <text x="616" y="430">Pack Iconos <tspan fill="#2563eb" font-weight="700">500+</tspan></text>
  </g>

  <!-- DESGLOSE: centro (titulo) y derecha -->
  <text x="112" y="520" class="lbl" fill="#93c5fd">Centro y derecha</text>
  <rect x="112" y="532" width="384" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="304" y="549" font-size="9.5" text-anchor="middle" fill="#334155">Título: flex-1 · max-w-sm (384px) · mx-4 (16px)</text>

  <rect x="512" y="532" width="150" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="587" y="549" font-size="9.5" text-anchor="middle" fill="#047857">badge offline: px-2 py-0.5 · text-[11px]</text>

  <rect x="678" y="532" width="180" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="768" y="549" font-size="9.5" text-anchor="middle" fill="#334155">botón tema UI: p-1.5 · icono w-4 h-4 (16px)</text>

  <!-- COTA ANCHO TOTAL -->
  <line x1="100" y1="590" x2="1040" y2="590" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="570" y="584" class="cota-txt" font-size="12" text-anchor="middle">100% del layout (ancho fluido) · h-10 = 40px fijo</text>

  <!-- NOTA RESPONSIVE -->
  <text x="112" y="618" class="lbl-sm" fill="#93c5fd">Responsivo: el título "FreeMind Map Studio" se oculta bajo sm(640px) · el texto "100% Offline" se oculta bajo md(768px) · ítems con kbd usan text-[10px] font-mono</text>
</svg>
