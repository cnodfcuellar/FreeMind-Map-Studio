<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
      .body { font-size:10.5px; fill:#334155; }
    </style>
  </defs>

  <rect width="1300" height="790" rx="16" fill="#0f172a"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">ToolPanel §6.0 (contenedor) — Medidas detalladas</text>
  <text x="32" y="62" font-size="12.5" fill="#93c5fd">Escala 1:1 (1px = 1px real) · ToolPanel.tsx:85-272 · w-84 = 336px fijo · las pestañas se detallan en §6.1-§6.6</text>

  <!-- Panel real a escala 1:1 (336 x 560) -->
  <rect x="60" y="96" width="336" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- Cabecera (px-4 py-3, alto ~44) -->
  <rect x="61" y="97" width="334" height="44" fill="#f8fafc" stroke="#f1f5f9"/>
  <rect x="76" y="111" width="16" height="16" rx="3" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="79" y1="116" x2="89" y2="116" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="79" y1="122" x2="89" y2="122" stroke="#2563eb" stroke-width="1.6"/>
  <text x="100" y="125" font-size="12" font-weight="600" fill="#0f172a">Panel de Propiedades</text>
  <rect x="366" y="108" width="24" height="24" rx="8" fill="#f1f5f9"/>
