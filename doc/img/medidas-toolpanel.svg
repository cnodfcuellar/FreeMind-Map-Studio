  <line x1="382" y1="116" x2="374" y2="124" stroke="#94a3b8" stroke-width="1.6"/>

  <!-- Barra de pestañas (grid-cols-6, alto ~46) -->
  <rect x="61" y="141" width="334" height="46" fill="#f8fafc" stroke="#f1f5f9"/>
  <rect x="61" y="141" width="56" height="46" fill="#ffffff"/>
  <rect x="61" y="184" width="56" height="3" fill="#2563eb"/>
  <g stroke-width="1.3" fill="none">
    <text x="89" y="160" font-size="12" text-anchor="middle" fill="#2563eb">T</text>
    <text x="145" y="160" font-size="12" text-anchor="middle" fill="#94a3b8">◑</text>
    <text x="201" y="160" font-size="12" text-anchor="middle" fill="#94a3b8">▤</text>
    <text x="257" y="160" font-size="12" text-anchor="middle" fill="#94a3b8">☺</text>
    <text x="313" y="160" font-size="12" text-anchor="middle" fill="#94a3b8">☁</text>
    <text x="369" y="160" font-size="12" text-anchor="middle" fill="#94a3b8">⧉</text>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="89" y="176" fill="#2563eb" font-weight="700">Texto</text>
    <text x="145" y="176" fill="#64748b">Estilos</text>
    <text x="201" y="176" fill="#64748b">Notas</text>
    <text x="257" y="176" fill="#64748b">Iconos</text>
    <text x="313" y="176" fill="#64748b">Nubes</text>
    <text x="369" y="176" fill="#64748b">Mapa</text>
  </g>
  <line x1="117" y1="146" x2="117" y2="182" stroke="#e2e8f0"/>
  <line x1="173" y1="146" x2="173" y2="182" stroke="#e2e8f0"/>
  <line x1="229" y1="146" x2="229" y2="182" stroke="#e2e8f0"/>
