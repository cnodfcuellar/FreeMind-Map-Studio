  <rect x="61" y="187" width="334" height="468" fill="#ffffff"/>
  <text x="228" y="380" font-size="12" font-weight="500" text-anchor="middle" fill="#475569">Ningún nodo seleccionado</text>
  <text x="228" y="398" font-size="10" text-anchor="middle" fill="#94a3b8">Haz clic en cualquier nodo para modificar sus propiedades.</text>
  <text x="228" y="430" font-size="9" text-anchor="middle" fill="#cbd5e1">(estado vacío: sin nodo y pestaña ≠ Mapa)</text>

  <!-- Cotas verticales -->
  <line x1="46" y1="96" x2="46" y2="141" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="40" y="122" class="cota-txt" text-anchor="end">44</text>
  <line x1="46" y1="141" x2="46" y2="187" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="40" y="168" class="cota-txt" text-anchor="end">46</text>
  <line x1="46" y1="187" x2="46" y2="655" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="40" y="425" class="cota-txt" text-anchor="end">flex-1</text>

  <!-- Cota ancho -->
  <line x1="60" y1="672" x2="396" y2="672" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="228" y="688" class="cota-txt" text-anchor="middle">336px (w-84) · ancho fijo en todos los breakpoints</text>
  <text x="228" y="704" font-size="9.5" text-anchor="middle" fill="#93c5fd">if (!isOpen) return null · border-l + shadow-xl · z-10 · h-full</text>

  <!-- Detalle 1: cabecera -->
  <text x="440" y="88" class="lbl" fill="#93c5fd">Cabecera — px-4 py-3 (16px/12px) · border-b slate-100 · bg sp-bg2 · alto ~44px</text>
  <rect x="440" y="96" width="800" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="456" y="112" width="320" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="470" y="124" width="16" height="16" rx="3" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="473" y1="129" x2="483" y2="129" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="473" y1="135" x2="483" y2="135" stroke="#2563eb" stroke-width="1.6"/>
  <text x="494" y="138" font-size="12" font-weight="600" fill="#0f172a">Panel de Propiedades</text>
  <rect x="744" y="120" width="24" height="24" rx="8" fill="#f1f5f9"/>
  <line x1="752" y1="128" x2="760" y2="136" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="760" y1="128" x2="752" y2="136" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="456" y="178" class="body">Izq: Sliders w-4 h-4 (16px, blue-600) + h2 font-semibold text-sm (14px) · gap-2 (8px)</text>
  <text x="456" y="198" class="body">Der: botón cerrar p-1 (4px) + X w-4 h-4 (16px) · rounded-lg · hover slate-700 / slate-200/60</text>

  <!-- Detalle 2: barra de pestañas -->
  <text x="440" y="244" class="lbl" fill="#93c5fd">Barra de pestañas — grid-cols-6 · cada celda = 336/6 = 56px · text-[11px]</text>
  <rect x="440" y="252" width="800" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="456" y="266" width="336" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="456" y="266" width="56" height="46" fill="#f8fafc"/>
  <rect x="456" y="309" width="56" height="3" fill="#2563eb"/>
  <g font-size="12" text-anchor="middle">
    <text x="484" y="285" fill="#2563eb" font-weight="700">T</text>
    <text x="540" y="285" fill="#94a3b8">◑</text>
    <text x="596" y="285" fill="#94a3b8">▤</text>
    <text x="652" y="285" fill="#94a3b8">☺</text>
    <text x="708" y="285" fill="#94a3b8">☁</text>
    <text x="764" y="285" fill="#94a3b8">⧉</text>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="484" y="301" fill="#2563eb" font-weight="700">Texto</text>
    <text x="540" y="301" fill="#64748b">Estilos</text>
    <text x="596" y="301" fill="#64748b">Notas</text>
    <text x="652" y="301" fill="#64748b">Iconos</text>
    <text x="708" y="301" fill="#64748b">Nubes</text>
    <text x="764" y="301" fill="#64748b">Mapa</text>
  </g>
  <line x1="456" y1="322" x2="512" y2="322" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="484" y="336" class="cota-txt" font-size="9" text-anchor="middle">56px</text>
  <text x="816" y="285" class="body">Cada botón: py-2 px-1 (8px/4px) · flex-col center</text>
  <text x="816" y="303" class="body">Icono w-3.5 h-3.5 (14px) mb-0.5 (2px)</text>
  <text x="816" y="321" class="body">Etiqueta: truncate w-full text-center</text>
  <text x="816" y="339" class="body">border-b slate-200 · divide-x slate-200/60</text>
  <text x="456" y="362" class="body">Activa: bg-white text-blue-600 font-semibold border-b-2 border-blue-600 shadow-2xs</text>
  <text x="456" y="382" class="body">Inactiva: text sp-muted · hover bg sp-hover + text sp-text</text>
  <text x="456" y="402" class="body">Orden y tooltip: Texto (Type) · Estilos (Palette) · Notas (FileText) · Iconos (Smile) · Nubes (Cloud) · Mapa (Layers)</text>
  <text x="456" y="422" class="body">Estado: activeTab (TabType) · default 'content' · se cambia con setActiveTab (sin persistencia)</text>

  <!-- Detalle 3: area de contenido -->
  <text x="440" y="478" class="lbl" fill="#93c5fd">Área de contenido — flex-1 overflow-y-auto · p-4 (16px) · space-y-5 (20px) · text-xs (12px)</text>
  <rect x="440" y="486" width="800" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="456" y="500" width="336" height="112" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="624" y="546" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">Ningún nodo seleccionado</text>
  <text x="624" y="562" font-size="9" text-anchor="middle" fill="#94a3b8">Haz clic en cualquier nodo para modificar sus propiedades.</text>
  <text x="624" y="584" font-size="8.5" text-anchor="middle" fill="#cbd5e1">py-12 (48px) · centrado</text>
  <text x="816" y="518" class="body">Estado vacío (py-12): si !selectedNode y la pestaña</text>
  <text x="816" y="536" class="body">NO es 'theme' → mensaje centrado, sin contenido</text>
  <text x="816" y="554" class="body">Título: font-medium text-sm slate-600</text>
  <text x="816" y="572" class="body">Subtítulo: text-xs mt-1 slate-400</text>
  <text x="816" y="590" class="body">Si hay nodo: se renderiza SOLO la pestaña activa</text>
  <text x="816" y="608" class="body">(Content/Format/Notes/Icons/Clouds/Theme → §6.1-§6.6)</text>

  <!-- Detalle 4: estados y cableado -->
  <text x="440" y="652" class="lbl" fill="#93c5fd">Estados, posición y cableado</text>
  <rect x="440" y="660" width="800" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="456" y="684" class="body">Posición: derecha de la zona de trabajo (MainEditorLayout:58) · se oculta si el Outline está maximizado</text>
  <text x="456" y="704" class="body">'Mapa' (ThemeTab) es la ÚNICA pestaña que funciona sin nodo seleccionado (recibe mindMap/tema)</text>
  <text x="456" y="724" class="body">Sin media queries: 336px fijos siempre (a diferencia del Outline: 320/352px con md)</text>
  <text x="456" y="744" class="body">ThemeTab recibe un adaptador onUpdateMapGaps → onUpdateMapSpacing (ToolPanel:249-259, cableado 2026-10-17)</text>
  <text x="456" y="764" class="body">Sin cambios de estado global: solo activeTab (useState local) · no escribe localStorage</text>
</svg>
