<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Filtro de Halo Ámbar Spotlight -->
    <filter id="spotlight-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Gradientes -->
    <linearGradient id="grad-root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Patrón de Fondo -->
    <pattern id="bg-grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fondo Lienzo -->
  <rect width="1200" height="800" fill="#090d16" />
  <rect width="1200" height="800" fill="url(#bg-grid-dots)" />

  <!-- Cabecera -->
  <rect x="30" y="20" width="1140" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="55" cy="46" r="11" fill="#f59e0b" />
  <text x="55" y="50" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">🔍</text>
  <text x="78" y="44" font-size="15" font-weight="700" fill="#ffffff">Filtros Avanzados por Metadatos y Efecto Visual Spotlight en el Lienzo</text>
  <text x="78" y="60" font-size="11.5" fill="#94a3b8">Aislamiento instantáneo de nodos relevantes con atenuación al 22% de ramas secundarias (Ctrl + F)</text>

  <!-- ======================================================== -->
  <!-- COMPONENTE REAL: FILTERBAR EXPANDIDA (h-10 + Drawer) -->
  <!-- ======================================================== -->
  <g transform="translate(30, 85)">
    <!-- Barra principal -->
    <rect x="0" y="0" width="1140" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow-card)" />
    
    <!-- Input texto -->
    <rect x="15" y="7" width="220" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="25" y="25" font-size="11" fill="#38bdf8" font-weight="600">🔍 Stripe</text>

    <!-- Dropdown Etiquetas con #urgente seleccionado -->
    <rect x="245" y="7" width="135" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="255" y="25" font-size="10.5" font-weight="700" fill="#fbbf24">🏷️ #urgente (1)</text>

    <!-- Dropdown Progreso >= 50% -->
    <rect x="390" y="7" width="140" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="400" y="25" font-size="10.5" font-weight="700" fill="#34d399">📊 Progreso ≥ 50%</text>

    <!-- Botón Toggle Metadatos Activo -->
    <rect x="540" y="7" width="110" height="28" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.2" />
    <text x="595" y="25" font-size="10.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">− Metadatos</text>

    <!-- Badge Coincidencias -->
    <rect x="660" y="9" width="125" height="24" rx="6" fill="#1e3a5f" stroke="#1e40af" stroke-width="1" />
    <text x="722" y="25" font-size="10.5" font-weight="700" fill="#93c5fd" text-anchor="middle">✨ 2 Coincidencias</text>

    <!-- Botón Limpiar y Cerrar -->
    <text x="1030" y="26" font-size="10.5" font-weight="600" fill="#94a3b8">Limpiar filtros</text>
    <rect x="1098" y="7" width="28" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="1112" y="25" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">✕</text>

    <!-- SUBPANEL DRAWER DE METADATOS EXPANDIDO -->
    <g transform="translate(0, 43)">
      <rect x="0" y="0" width="1140" height="42" rx="0 0 8 8" fill="#141c2e" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="25" font-size="10.5" font-weight="700" fill="#94a3b8">Contenido:</text>
      
      <!-- Pill Con Notas (ACTIVA) -->
      <rect x="90" y="8" width="96" height="26" rx="13" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2" />
      <text x="138" y="25" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">📝 Con Notas</text>

      <!-- Pill Con Enlaces -->
      <rect x="195" y="8" width="96" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="243" y="25" font-size="10" fill="#94a3b8" text-anchor="middle">🔗 Con Enlaces</text>

      <!-- Pill Con Imágenes -->
      <rect x="300" y="8" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="352" y="25" font-size="10" fill="#94a3b8" text-anchor="middle">🖼️ Con Imágenes</text>

      <!-- Pill En Nube -->
      <rect x="415" y="8" width="85" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="457" y="25" font-size="10" fill="#94a3b8" text-anchor="middle">☁️ En Nube</text>

      <!-- Pill Árbol Contextual (ACTIVA) -->
      <rect x="510" y="8" width="135" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1.2" />
      <text x="577" y="25" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">🌳 Árbol Contextual</text>

      <!-- Fecha -->
      <text x="660" y="25" font-size="10" fill="#64748b">Fecha: Cualquier Fecha ▾</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- LIENZO DEMOSTRATIVO CON EFECTO SPOTLIGHT -->
  <!-- ======================================================== -->

  <!-- GRUPO 1: ELEMENTOS ATENUADOS (opacity="0.22") -->
  <g id="dimmed-elements" opacity="0.22">
    <!-- Rama Raíz a Marketing (Izquierda) -->
    <path d="M 500 450 C 400 450, 360 330, 260 330" stroke="#10b981" stroke-width="3" fill="none" />
    <path d="M 160 330 C 120 330, 110 280, 50 280" stroke="#059669" stroke-width="2" fill="none" />
    <path d="M 160 330 C 120 330, 110 380, 50 380" stroke="#059669" stroke-width="2" fill="none" />

    <!-- Nodo Marketing -->
    <g transform="translate(160, 300)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="90" y="30" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Marketing &amp; Ventas</text>
      <text x="90" y="46" font-size="9" fill="#a7f3d0" text-anchor="middle">#marketing · 75%</text>
    </g>
    <!-- Subnodos Marketing -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="65" y="24" font-size="10" fill="#cbd5e1" text-anchor="middle">Google Ads</text>
    </g>
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="65" y="24" font-size="10" fill="#cbd5e1" text-anchor="middle">Webinar Demo</text>
    </g>

    <!-- Rama Raíz a Legal (Izquierda Abajo) -->
    <path d="M 500 450 C 400 450, 360 570, 260 570" stroke="#8b5cf6" stroke-width="3" fill="none" />
    <g transform="translate(160, 540)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5" />
      <text x="90" y="30" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Cumplimiento Legal</text>
      <text x="90" y="46" font-size="9" fill="#ddd6fe" text-anchor="middle">#legal · 30%</text>
    </g>

    <!-- Rama Raíz a UX (Derecha Abajo) -->
    <path d="M 700 450 C 800 450, 840 570, 930 570" stroke="#f59e0b" stroke-width="3" fill="none" />
    <g transform="translate(830, 540)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
      <text x="90" y="30" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Experiencia &amp; UI</text>
      <text x="90" y="46" font-size="9" fill="#fde68a" text-anchor="middle">#ux · 60%</text>
    </g>
  </g>

  <!-- GRUPO 2: CONTEXTO JERÁRQUICO ACTIVO (Modo includeAncestors - 85% Opacidad) -->
  <g id="ancestors-path">
    <!-- Raíz (Nodo Padre Principal preservado por contexto) -->
    <g transform="translate(485, 415)">
      <rect x="0" y="0" width="230" height="70" rx="14" fill="url(#grad-root)" stroke="#818cf8" stroke-width="2" />
      <text x="115" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">🚀 Lanzamiento SaaS</text>
      <text x="115" y="52" font-size="10.5" fill="#c7d2fe" text-anchor="middle">Padre raíz (Preservado en contexto)</text>
    </g>

    <!-- Arista que conecta Raíz con Rama Producto -->
    <path d="M 700 450 C 780 450, 820 330, 870 330" stroke="#0ea5e9" stroke-width="3.5" fill="none" />

    <!-- Nodo Producto (Padre Inmediato) -->
    <g transform="translate(820, 295)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
      <text x="100" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚙️ Producto &amp; Backend</text>
      <text x="100" y="46" font-size="9.5" fill="#7dd3fc" text-anchor="middle">Rama contenedora (Padre)</text>
      <text x="100" y="58" font-size="8.5" fill="#38bdf8" text-anchor="middle">Progreso: 90%</text>
    </g>

    <!-- Arista hacia nodo hijo coincidente -->
    <path d="M 1020 330 C 1050 330, 1060 330, 1080 330" stroke="#f59e0b" stroke-width="2.5" fill="none" />
  </g>

  <!-- GRUPO 3: NODO COINCIDENTE ILUMINADO (SPOTLIGHT ACTIVO - 100% Opacidad + Halo Ámbar) -->
  <g id="spotlight-node" transform="translate(1030, 290)" filter="url(#spotlight-glow)">
    <!-- Borde exterior de halo ámbar brillante -->
    <rect x="-3" y="-3" width="166" height="82" rx="12" fill="none" stroke="#f59e0b" stroke-width="3" />
    
    <!-- Cuerpo de tarjeta -->
    <rect x="0" y="0" width="160" height="76" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8" />
    
    <!-- Título con coincidencia resaltada -->
    <text x="14" y="24" font-size="12" font-weight="800" fill="#fef08a">✨ Pasarela Stripe</text>
    
    <!-- Tags -->
    <rect x="14" y="32" width="55" height="15" rx="3" fill="#78350f" />
    <text x="41" y="43" font-size="8.5" font-weight="700" fill="#fde68a" text-anchor="middle">#urgente</text>
    
    <!-- Indicador de Nota Markdown -->
    <rect x="74" y="32" width="65" height="15" rx="3" fill="#0284c7" />
    <text x="106" y="43" font-size="8.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">📝 Con Nota</text>

    <!-- Barra de progreso 90% -->
    <text x="14" y="62" font-size="8.5" font-weight="600" fill="#a7f3d0">90% Completado</text>
    <rect x="80" y="56" width="65" height="6" rx="3" fill="#064e3b" />
    <rect x="80" y="56" width="58" height="6" rx="3" fill="#10b981" />
  </g>

  <!-- ======================================================== -->
  <!-- LLAMADAS EXPLICATIVAS Y COMPARATIVA ANTES / DESPUÉS -->
  <!-- ======================================================== -->
  <g transform="translate(30, 690)">
    <rect x="0" y="0" width="1140" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Callout 1 -->
    <g transform="translate(30, 16)">
      <circle cx="12" cy="14" r="10" fill="#f59e0b" />
      <text x="12" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="32" y="14" font-size="12" font-weight="700" fill="#fbbf24">Halo Spotlight Focal</text>
      <text x="32" y="30" font-size="10" fill="#cbd5e1">Los nodos coincidentes brillan con 100% de opacidad y anillo ámbar luminoso.</text>
      <text x="32" y="44" font-size="9" fill="#94a3b8">Facilita localizar tareas en mapas de 100+ ramas sin perder la posición.</text>
    </g>

    <!-- Callout 2 -->
    <g transform="translate(420, 16)">
      <circle cx="12" cy="14" r="10" fill="#64748b" />
      <text x="12" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="32" y="14" font-size="12" font-weight="700" fill="#cbd5e1">Atenuación al 22% de Ruido</text>
      <text x="32" y="30" font-size="10" fill="#cbd5e1">Las ramas secundarias que no cumplen las condiciones se apagan suavemente.</text>
      <text x="32" y="44" font-size="9" fill="#94a3b8">No se eliminan ni se mueven: permanecen en su sitio como referencia espacial.</text>
    </g>

    <!-- Callout 3 -->
    <g transform="translate(800, 16)">
      <circle cx="12" cy="14" r="10" fill="#10b981" />
      <text x="12" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="32" y="14" font-size="12" font-weight="700" fill="#a7f3d0">Árbol Contextual Dinámico</text>
      <text x="32" y="30" font-size="10" fill="#cbd5e1">Al activar [🌳 Árbol Contextual], los padres directos se mantienen legibles.</text>
      <text x="32" y="44" font-size="9" fill="#94a3b8">Evita que los nodos queden "flotando aislados" sin saber a qué área pertenecen.</text>
    </g>
  </g>
</svg>