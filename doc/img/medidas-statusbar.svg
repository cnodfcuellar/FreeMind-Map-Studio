<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="16" fill="#0f172a"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">StatusBar — Medidas detalladas</text>
  <text x="32" y="62" font-size="12.5" fill="#93c5fd">Escala 1:1 (1px = 1px real) · StatusBar.tsx:23-49 · h-6 = 24px · px-3 = 12px · gap-4 = 16px</text>

  <!-- BARRA (escala 1:1) -->
  <rect x="60" y="96" width="1080" height="24" rx="4" fill="#0f172a" stroke="#334155"/>

  <!-- Segmentos con separadores -->
  <text x="140" y="112" font-size="9.5" fill="#e2e8f0">Nodos totales: <tspan fill="#ffffff" font-weight="700">42</tspan></text>
  <line x1="250" y1="102" x2="250" y2="114" stroke="#334155"/>
  <text x="330" y="112" font-size="9.5" fill="#e2e8f0">Seleccionado: <tspan fill="#ffffff">"Plan semanal"</tspan> <tspan fill="#64748b">(ID: node-3)</tspan></text>
  <line x1="530" y1="102" x2="530" y2="114" stroke="#334155"/>
  <text x="600" y="112" font-size="9.5" fill="#e2e8f0">Zoom: <tspan fill="#ffffff" font-weight="700">100%</tspan></text>
  <line x1="670" y1="102" x2="670" y2="114" stroke="#334155"/>
  <text x="740" y="112" font-size="9.5" fill="#e2e8f0">Posición: <tspan fill="#ffffff">(X: 120, Y: 84)</tspan></text>
  <line x1="900" y1="102" x2="900" y2="114" stroke="#334155"/>
  <text x="960" y="112" font-size="9.5" fill="#e2e8f0">Modo: <tspan fill="#ffffff">Editando</tspan></text>

  <!-- COTA ALTURA (x=42) -->
  <line x1="44" y1="96" x2="44" y2="120" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="38" y="112" class="cota-txt" text-anchor="end">24px</text>
  <text x="38" y="124" font-size="9" text-anchor="end" fill="#b45309">h-6</text>

  <!-- Padding px-3 (12px) -->
  <line x1="60" y1="132" x2="72" y2="132" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="66" y="146" class="cota-txt" font-size="9" text-anchor="middle">12px</text>
  <text x="66" y="158" font-size="8.5" text-anchor="middle" fill="#b45309">px-3</text>

  <!-- Gap-4 (16px) -->
  <line x1="250" y1="132" x2="266" y2="132" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="258" y="146" class="cota-txt" font-size="9" text-anchor="middle">16px</text>
  <text x="258" y="158" font-size="8.5" text-anchor="middle" fill="#b45309">gap-4</text>

  <!-- DESGLOSE de segmentos -->
  <text x="60" y="196" class="lbl" fill="#93c5fd">Segmentos (5 datos separados por w-px h-3 = 1×12px, bg-slate-700)</text>

  <rect x="60" y="212" width="150" height="28" rx="6" fill="#1e293b"/>
  <text x="135" y="230" font-size="10" text-anchor="middle" fill="#e2e8f0">Nodos totales: 42</text>
  <text x="135" y="256" class="lbl-sm" text-anchor="middle">siempre visible</text>

  <rect x="240" y="212" width="260" height="28" rx="6" fill="#1e293b"/>
  <text x="370" y="230" font-size="10" text-anchor="middle" fill="#e2e8f0">Seleccionado: "Nodo" (ID: ...)</text>
  <text x="370" y="256" class="lbl-sm" text-anchor="middle">truncate · max-w-[200px] sm:max-w-md (448px)</text>
  <text x="370" y="268" font-size="8.5" text-anchor="middle" fill="#b45309">siempre visible</text>

  <rect x="540" y="212" width="90" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-dasharray="3 2"/>
  <text x="585" y="230" font-size="10" text-anchor="middle" fill="#e2e8f0">Zoom: 100%</text>
  <text x="585" y="256" class="lbl-sm" text-anchor="middle">hidden sm:block</text>
  <text x="585" y="268" font-size="8.5" text-anchor="middle" fill="#b45309">oculto &lt; 640px</text>

  <rect x="660" y="212" width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-dasharray="3 2"/>
  <text x="740" y="230" font-size="10" text-anchor="middle" fill="#e2e8f0">Posición: (X, Y)</text>
  <text x="740" y="256" class="lbl-sm" text-anchor="middle">hidden sm:block</text>
  <text x="740" y="268" font-size="8.5" text-anchor="middle" fill="#b45309">oculto &lt; 640px</text>

  <rect x="850" y="212" width="100" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-dasharray="3 2"/>
  <text x="900" y="230" font-size="10" text-anchor="middle" fill="#e2e8f0">Modo: Editando</text>
  <text x="900" y="256" class="lbl-sm" text-anchor="middle">hidden sm:block</text>
  <text x="900" y="268" font-size="8.5" text-anchor="middle" fill="#b45309">oculto &lt; 640px</text>

  <!-- TIPOGRAFÍA -->
  <text x="60" y="316" class="lbl" fill="#93c5fd">Tipografía y color</text>
  <rect x="60" y="332" width="330" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="354" font-size="11" fill="#334155">Base: text-[10px] sm:text-xs (10px → 12px ≥640px)</text>
  <text x="76" y="372" font-size="11" fill="#475569">Etiquetas: text-slate-400 · Valores: text-slate-200</text>
  <text x="76" y="390" font-size="11" fill="#64748b">ID: text-slate-500 · Fondo: chrome-bar</text>

  <!-- RESPONSIVE -->
  <text x="60" y="444" class="lbl" fill="#93c5fd">Comportamiento responsive</text>
  <rect x="60" y="460" width="540" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="482" font-size="11" fill="#334155">Nodos totales + Seleccionado: SIEMPRE visibles</text>
  <text x="76" y="500" font-size="11" fill="#475569">Zoom, Posición, Modo + 3 separadores: hidden sm:block</text>
  <text x="76" y="518" font-size="11" fill="#64748b">En &lt; 640px la barra queda: 2 datos + 1 separador</text>

  <!-- ESTRUCTURA -->
  <text x="640" y="444" class="lbl" fill="#93c5fd">Estructura</text>
  <rect x="640" y="460" width="500" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="482" font-size="11" fill="#334155">flex items-center gap-4 · z-30 · border-t slate-800</text>
  <text x="656" y="500" font-size="11" fill="#475569">1px de borde superior (border-t) — es el borde de la barra</text>
  <text x="656" y="518" font-size="11" fill="#64748b">Es la barra más delgada: 24px (MenuBar 40 · ToolBar 44)</text>

  <text x="60" y="572" class="lbl-sm" fill="#93c5fd">Valores reales: totalNodes (conteo de nodos) · selectedNodeText/ID · zoom% · positionX/Y (viewport) · mode ('Listo' | 'Editando')</text>
</svg>
