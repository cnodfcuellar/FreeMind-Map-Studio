  <!-- ============ NOTAS ============ -->
  <text x="440" y="648" class="lbl-sm" fill="#93c5fd">Árbol: render recursivo — depth anida hijos · node.folded oculta subárbol · lista con overflow-y-auto (scroll propio) · space-y-0.5 (2px) entre filas</text>
