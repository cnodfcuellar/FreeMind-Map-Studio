    <g transform="translate(24, 260)">
      <rect width="372" height="105" rx="10" fill="#f4eee0" stroke="#e2d9c8" />
      <text x="16" y="24" font-size="11" font-weight="700" fill="#451a03">Calibración Paramétrica</text>
