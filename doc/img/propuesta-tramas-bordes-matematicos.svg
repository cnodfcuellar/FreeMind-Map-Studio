<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#090d16; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1200" height="900" fill="#090d16" />
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
    <pattern id="pat-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1e293b" />
      <circle cx="6" cy="6" r="1.8" fill="#38bdf8" opacity="0.75" />
      <circle cx="18" cy="18" r="1.8" fill="#38bdf8" opacity="0.75" />
    </pattern>
    <pattern id="pat-lines" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="#1e293b" />
      <line x1="0" y1="8" x2="20" y2="8" stroke="#38bdf8" stroke-width="1.4" opacity="0.7" />
    </pattern>
    <pattern id="pat-stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1e293b" />
      <line x1="0" y1="20" x2="20" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" />
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" />
      <line x1="10" y1="30" x2="30" y2="10" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" />
    </pattern>
    <pattern id="pat-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#1e293b" />
      <path d="M 22,0 L 0,0 L 0,22" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.65" />
    </pattern>
    <pattern id="pat-isometric" width="34.64" height="20" patternUnits="userSpaceOnUse">
      <rect width="34.64" height="20" fill="#1e293b" />
      <line x1="0" y1="10.0" x2="34.64" y2="10.0" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
      <line x1="0" y1="0" x2="34.64" y2="20" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
      <line x1="0" y1="20" x2="34.64" y2="0" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
    </pattern>
    <pattern id="pat-diamonds" width="20" height="34.64" patternUnits="userSpaceOnUse">
      <rect width="20" height="34.64" fill="#1e293b" />
      <polygon points="10.0,0 20,17.32 10.0,34.64 0,17.32" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75" />
    </pattern>
    <pattern id="pat-honeycomb" width="30" height="17.32" patternUnits="userSpaceOnUse">
      <rect width="30" height="17.32" fill="#1e293b" />
      <path d="M 0,8.66 L 5.0,0 L 15.0,0 L 20,8.66 L 15.0,17.32 L 5.0,17.32 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
      <path d="M 15.0,0 L 20,8.66 L 30,8.66" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
    </pattern>
    <pattern id="pat-crosses" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1e293b" />
      <line x1="5.3" y1="12" x2="18.7" y2="12" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
      <line x1="12" y1="5.3" x2="12" y2="18.7" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    </pattern>
  </defs>
  <g transform="translate(40, 24)">
    <rect width="1120" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="34" font-size="20" font-weight="800" fill="#f8fafc">📐 Arquitectura Gráfica de Fórmulas Matemáticas (§6.2 y §6.3)</text>
    <text x="28" y="55" font-size="12.5" fill="#94a3b8">Demostración en vivo de las 8 Familias de Tramas SVG, Bordes Paramétricos con Cuantización y Matrices Afines</text>
    <rect x="980" y="20" width="116" height="28" rx="7" fill="#0284c7" />
    <text x="1038" y="38" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Vía GPU / SVG</text>
  </g>
  <g transform="translate(40, 114)">
    <rect width="1120" height="340" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="32" font-size="15" font-weight="700" fill="#38bdf8">1. Las 8 Familias de Tramas Geométricas (§6.3)</text>
    <text x="28" y="50" font-size="11.5" fill="#64748b">Celdas unitarias matemáticamente calibradas para teselación periódica continua C⁰ (cero costuras al escalar)</text>
    <g transform="translate(28, 70)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-dots)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">1. Puntos (dots)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Al tresbolillo (0.25s, 0.75s)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Quincunx suave</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(296, 70)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-lines)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">2. Líneas (lines)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Horizontal centrada y = 0.5s</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Pautado uniforme</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(564, 70)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-stripes)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">3. Rayas (stripes)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">3 diagonales a 45° desfasadas</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Sin costuras C⁰</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(832, 70)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-grid)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">4. Cuadros (grid)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Escuadra en L M(s,0)→L(0,0)→L(0,s)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Anti doble-trazo</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(28, 195)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-isometric)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">5. Isométrico (isometric)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Triángulos a 60° (W = s√3, H = s)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Malla 3D exacta</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(296, 195)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-diamonds)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">6. Rombos (diamonds)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Rómbico Kepler (w = s, h = s√3)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Rombo 60°/120°</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(564, 195)">
