        <text x="105" y="33" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Nodo con Doble Borde</text>
      </g>
      <text x="14" y="124" font-size="9" fill="#4ade80">✔ Concéntrico exacto en centroide (w/2, h/2)</text>
    </g>
    <g transform="translate(348, 70)">
      <rect width="304" height="135" rx="12" fill="#1e293b" stroke="#334155" />
      <text x="14" y="24" font-size="11.5" font-weight="700" fill="#38bdf8">B. Ondulado Bézier (wavy) Cuantizado</text>
      <text x="14" y="40" font-size="9" fill="#94a3b8">N = round(L/step) → ciclos completos en las 4 esquinas</text>
      <g transform="translate(42, 52)">
        <path d="M 0,0 Q 27.5,6 55,0 Q 82.5,-6 110,0 Q 137.5,6 165,0 Q 192.5,-6 220,0 Q 226,14 220,28 Q 214,42 220,56 Q 192.5,50 165,56 Q 137.5,62 110,56 Q 82.5,50 55,56 Q 27.5,62 0,56 Q -6,42 0,28 Q 6,14 0,0 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
        <text x="110" y="33" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Ondulado Sin Esquinas Rotas</text>
      </g>
      <text x="14" y="124" font-size="9" fill="#4ade80">✔ Q(x_mid, ±1.3·amp, x2, y2) armónico suave</text>
    </g>
    <g transform="translate(28, 220)">
      <rect width="300" height="150" rx="12" fill="#1e293b" stroke="#334155" />
      <text x="14" y="24" font-size="11.5" font-weight="700" fill="#38bdf8">C. Dientes de Sierra (zigzag)</text>
      <text x="14" y="40" font-size="9" fill="#94a3b8">Alternancia (-1)^i · amp con step calibrado</text>
      <g transform="translate(45, 54)">
        <path d="M 0,0 L 25,5 L 50,-5 L 75,5 L 100,-5 L 125,5 L 150,-5 L 175,5 L 200,-5 L 210,0 L 215,28 L 210,56 L 175,51 L 150,61 L 125,51 L 100,61 L 75,51 L 50,61 L 25,51 L 0,56 L -5,28 Z" fill="#065f46" stroke="#34d399" stroke-width="2" />
        <text x="105" y="33" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Zigzag Cuantizado</text>
      </g>
      <text x="14" y="136" font-size="9" fill="#4ade80">✔ Cierre perimetral sin truncamiento</text>
    </g>
    <g transform="translate(348, 220)">
      <rect width="304" height="150" rx="12" fill="#1e293b" stroke="#334155" />
      <text x="14" y="24" font-size="11.5" font-weight="700" fill="#38bdf8">D. Puntos Paramétricos (dotted)</text>
      <text x="14" y="40" font-size="9" fill="#94a3b8">stroke-linecap="round", 0.1, dotGap exacto</text>
      <g transform="translate(42, 54)">
        <rect x="0" y="0" width="220" height="56" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 10" />
        <text x="110" y="33" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Puntos Esferoidales SVG</text>
      </g>
      <text x="14" y="136" font-size="9" fill="#4ade80">✔ Círculos puros sin inconsistencias de navegador</text>
    </g>
  </g>
