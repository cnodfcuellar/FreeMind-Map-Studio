      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-honeycomb)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">7. Panal (honeycomb)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Voronoi 2 columnas (3s × s√3)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Hexágonos puros</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
    <g transform="translate(832, 195)">
      <rect width="256" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="84" height="94" rx="8" fill="url(#pat-crosses)" stroke="#0284c7" stroke-width="1.5" />
      <text x="104" y="28" font-size="12" font-weight="700" fill="#f8fafc">8. Cruces (crosses)</text>
      <text x="104" y="46" font-size="9.5" fill="#94a3b8">Cruces griegas (brazo = 0.28s)</text>
      <rect x="104" y="58" width="120" height="20" rx="5" fill="#0369a1" />
      <text x="164" y="72" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">✔ Respiración áurea</text>
      <text x="104" y="96" font-size="9" fill="#38bdf8">patternUnits="userSpaceOnUse"</text>
    </g>
  </g>
  <g transform="translate(40, 474)">
    <rect width="680" height="390" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="32" font-size="15" font-weight="700" fill="#38bdf8">2. Fórmulas de Bordes y Contornos (§6.2)</text>
    <text x="28" y="50" font-size="11.5" fill="#64748b">Matriz afín concéntrica outset y cuantización cerrada de ciclos enteros N = round(L / step)</text>
    <g transform="translate(28, 70)">
      <rect width="300" height="135" rx="12" fill="#1e293b" stroke="#334155" />
