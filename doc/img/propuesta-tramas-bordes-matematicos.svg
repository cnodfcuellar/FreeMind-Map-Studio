      <text x="14" y="40" font-size="9" fill="#94a3b8">matrix(sx, 0, 0, sy, -gap, -gap) con gap=5px</text>
      <g transform="translate(45, 52)">
        <rect x="-5" y="-5" width="220" height="66" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5" />
