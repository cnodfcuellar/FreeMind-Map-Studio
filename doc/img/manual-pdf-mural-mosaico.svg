<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Filtros de Sombra para Hojas Físicas -->
    <filter id="shadow-sheet" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Gradientes -->
    <linearGradient id="grad-sheet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Patrón de Fondo -->
    <pattern id="bg-grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fondo Lienzo -->
  <rect width="1200" height="820" fill="#090d16" />
  <rect width="1200" height="820" fill="url(#bg-grid-dots)" />

  <!-- Cabecera -->
  <rect x="30" y="20" width="1140" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="55" cy="46" r="11" fill="#10b981" />
  <text x="55" y="50" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">🖨️</text>
  <text x="78" y="44" font-size="15" font-weight="700" fill="#ffffff">Motor de Impresión Vectorial en Mosaico Multipágina (Mural 2×2 con Solape de 15 mm)</text>
  <text x="78" y="60" font-size="11.5" fill="#94a3b8">Divide mapas mentales gigantes en hojas A4/Carta estándar con marcas de corte perimetrales listas para montaje</text>

  <!-- ======================================================== -->
  <!-- ESQUEMA DEL MURAL 2×2 (4 HOJAS IMPRESAS CON SOLAPE) -->
  <!-- ======================================================== -->
  <g transform="translate(60, 95)">
    <!-- Marco de fondo del área de montaje -->
    <rect x="0" y="0" width="700" height="580" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="350" y="30" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Área Total del Mural Ensamblado: 2 Hojas Ancho × 2 Hojas Alto (~840 × 594 mm)</text>

    <!-- HOJA 1 (Superior Izquierda) -->
    <g transform="translate(30, 50)" filter="url(#shadow-sheet)">
      <rect x="0" y="0" width="310" height="230" rx="4" fill="url(#grad-sheet-1)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Marcas de corte esquinas Hoja 1 -->
      <path d="M 6 15 L 6 6 L 15 6" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 295 6 L 304 6 L 304 15" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 6 215 L 6 224 L 15 224" stroke="#e11d48" stroke-width="1.5" fill="none" />
      
      <!-- Contenido de mapa Hoja 1: Rama Marketing -->
      <text x="20" y="30" font-size="10" font-weight="800" fill="#0284c7">PÁGINA 1 / 4 (Sup-Izq)</text>
      <!-- Subrama dibujada -->
      <path d="M 280 200 C 200 200, 160 120, 110 120" stroke="#059669" stroke-width="2.5" fill="none" />
      <rect x="50" y="105" width="90" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2" />
      <text x="95" y="124" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Marketing Q4</text>
      
      <!-- Pie de página técnico -->
      <line x1="15" y1="212" x2="295" y2="212" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="20" y="222" font-size="7.5" fill="#64748b">FreeMind Map Studio · SaaS Q4 · Hoja 1/4</text>
    </g>

    <!-- HOJA 2 (Superior Derecha) -->
    <g transform="translate(360, 50)" filter="url(#shadow-sheet)">
      <rect x="0" y="0" width="310" height="230" rx="4" fill="url(#grad-sheet-1)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Marcas de corte Hoja 2 -->
      <path d="M 6 15 L 6 6 L 15 6" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 295 6 L 304 6 L 304 15" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 304 215 L 304 224 L 295 224" stroke="#e11d48" stroke-width="1.5" fill="none" />

      <text x="20" y="30" font-size="10" font-weight="800" fill="#0284c7">PÁGINA 2 / 4 (Sup-Der)</text>
      <!-- Subrama Producto -->
      <path d="M 30 200 C 90 200, 140 120, 200 120" stroke="#0284c7" stroke-width="2.5" fill="none" />
      <rect x="160" y="105" width="90" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
      <text x="205" y="124" font-size="9" font-weight="700" fill="#0c4a6e" text-anchor="middle">Backend API</text>

      <line x1="15" y1="212" x2="295" y2="212" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="20" y="222" font-size="7.5" fill="#64748b">FreeMind Map Studio · SaaS Q4 · Hoja 2/4</text>
    </g>

    <!-- HOJA 3 (Inferior Izquierda) -->
    <g transform="translate(30, 310)" filter="url(#shadow-sheet)">
      <rect x="0" y="0" width="310" height="230" rx="4" fill="url(#grad-sheet-1)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Marcas de corte Hoja 3 -->
      <path d="M 6 15 L 6 6 L 15 6" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 6 215 L 6 224 L 15 224" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 295 224 L 304 224 L 304 215" stroke="#e11d48" stroke-width="1.5" fill="none" />

      <text x="20" y="30" font-size="10" font-weight="800" fill="#0284c7">PÁGINA 3 / 4 (Inf-Izq)</text>
      <!-- Subrama Legal -->
      <path d="M 280 40 C 200 40, 160 120, 110 120" stroke="#7c3aed" stroke-width="2.5" fill="none" />
      <rect x="50" y="105" width="90" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
      <text x="95" y="124" font-size="9" font-weight="700" fill="#4c1d95" text-anchor="middle">Legal &amp; RGPD</text>

      <line x1="15" y1="212" x2="295" y2="212" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="20" y="222" font-size="7.5" fill="#64748b">FreeMind Map Studio · SaaS Q4 · Hoja 3/4</text>
    </g>

    <!-- HOJA 4 (Inferior Derecha) -->
    <g transform="translate(360, 310)" filter="url(#shadow-sheet)">
      <rect x="0" y="0" width="310" height="230" rx="4" fill="url(#grad-sheet-1)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Marcas de corte Hoja 4 -->
      <path d="M 295 6 L 304 6 L 304 15" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 6 215 L 6 224 L 15 224" stroke="#e11d48" stroke-width="1.5" fill="none" />
      <path d="M 295 224 L 304 224 L 304 215" stroke="#e11d48" stroke-width="1.5" fill="none" />

      <text x="20" y="30" font-size="10" font-weight="800" fill="#0284c7">PÁGINA 4 / 4 (Inf-Der)</text>
      <!-- Subrama UX -->
      <path d="M 30 40 C 90 40, 140 120, 200 120" stroke="#d97706" stroke-width="2.5" fill="none" />
      <rect x="160" y="105" width="90" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
      <text x="205" y="124" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">UI / UX Mobile</text>

      <line x1="15" y1="212" x2="295" y2="212" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="20" y="222" font-size="7.5" fill="#64748b">FreeMind Map Studio · SaaS Q4 · Hoja 4/4</text>
    </g>

    <!-- NODO CENTRAL DISTRIBUIDO EN EL CRUCE CENTRAL DE LAS 4 HOJAS -->
    <g transform="translate(290, 250)">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
      <text x="60" y="25" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🚀 SaaS Q4</text>
    </g>

    <!-- BANDA DE SOLAPAMIENTO DE 15 MM ILUSTRADA (Franja Amarilla Translúcida) -->
    <!-- Solape vertical entre columna izquierda y derecha -->
    <rect x="330" y="50" width="40" height="490" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" />
    <text x="350" y="560" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Solape 15mm</text>

    <!-- Solape horizontal entre fila superior e inferior -->
    <rect x="30" y="270" width="640" height="40" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" />
    <text x="690" y="295" font-size="9" font-weight="700" fill="#fbbf24">Solape 15mm</text>
  </g>

  <!-- ======================================================== -->
  <!-- PANEL LATERAL DE INSTRUCCIONES DE MONTAJE (420px) -->
  <!-- ======================================================== -->
  <g transform="translate(780, 95)">
    <rect x="0" y="0" width="390" height="580" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="24" y="34" font-size="14" font-weight="700" fill="#10b981">Guía de Ensamblado Físico del Mural</text>
    <text x="24" y="52" font-size="11" fill="#94a3b8">Instrucciones para unir las hojas sin pérdida de información</text>
    <line x1="24" y1="65" x2="366" y2="65" stroke="#334155" stroke-width="1" />

    <!-- PASO 1 -->
    <g transform="translate(20, 80)">
      <circle cx="16" cy="16" r="14" fill="#0284c7" />
      <text x="16" y="21" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
      <text x="40" y="16" font-size="12" font-weight="700" fill="#ffffff">Imprimir en Papel A4 / Carta</text>
      <text x="40" y="32" font-size="10" fill="#cbd5e1">El motor exporta el PDF con paginación exacta (4 páginas). Usa escala 100% (sin ajustar márgenes).</text>
    </g>

    <!-- PASO 2 -->
    <g transform="translate(20, 160)">
      <circle cx="16" cy="16" r="14" fill="#e11d48" />
      <text x="16" y="21" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
      <text x="40" y="16" font-size="12" font-weight="700" fill="#ffffff">Identificar Marcas de Corte (L)</text>
      <text x="40" y="32" font-size="10" fill="#cbd5e1">Cada hoja incluye guías rojas en escuadra en las esquinas. Corta únicamente los bordes de unión interior con regla y cúter.</text>
    </g>

    <!-- PASO 3 -->
    <g transform="translate(20, 245)">
      <circle cx="16" cy="16" r="14" fill="#f59e0b" />
      <text x="16" y="21" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
      <text x="40" y="16" font-size="12" font-weight="700" fill="#ffffff">Solapar los 15 mm de Margen</text>
      <text x="40" y="32" font-size="10" fill="#cbd5e1">Monta la Hoja 2 sobre la franja punteada de la Hoja 1. Los textos y aristas Bézier coinciden con precisión milimétrica.</text>
    </g>

    <!-- PASO 4 -->
    <g transform="translate(20, 330)">
      <circle cx="16" cy="16" r="14" fill="#10b981" />
      <text x="16" y="21" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
      <text x="40" y="16" font-size="12" font-weight="700" fill="#ffffff">Fijar con Adhesivo o Cinta</text>
      <text x="40" y="32" font-size="10" fill="#cbd5e1">Aplica pegamento en barra o cinta transparente por el reverso. Tendrás un mural de pared de alta resolución.</text>
    </g>

    <!-- CUADRO DE VENTAJAS TÉCNICAS -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="350" height="135" rx="8" fill="#141c2e" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-size="11" font-weight="700" fill="#38bdf8">Especificaciones del Motor PDF:</text>
      <text x="16" y="44" font-size="9.5" fill="#cbd5e1">• Vectorial 100%: Textos nítidos con zoom óptico.</text>
      <text x="16" y="60" font-size="9.5" fill="#cbd5e1">• Ahorro de Tinta: Opción para fondo blanco puro.</text>
      <text x="16" y="76" font-size="9.5" fill="#cbd5e1">• Mallas Soportadas: 1×1 (Póster), 2×1, 2×2, 3×2, 3×3.</text>
      <text x="16" y="92" font-size="9.5" fill="#cbd5e1">• Pie técnico automático con fecha, autor y escala.</text>
      <text x="16" y="108" font-size="9.5" fill="#cbd5e1">• Salida dual: Impresión PDF y descarga .svg nativo.</text>
    </g>
  </g>

  <!-- Pie explicativo -->
  <g transform="translate(60, 690)">
    <rect x="0" y="0" width="1110" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(25, 18)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#ffffff">¿Por qué usar el modo Mosaico Multipágina en FreeMind Map Studio?</text>
      <text x="0" y="36" font-size="10.5" fill="#cbd5e1">
        En mapas mentales extensos (50 a 200 nodos), imprimir en una sola hoja A4 resulta en textos diminutos e ilegibles.
      </text>
      <text x="0" y="52" font-size="10.5" fill="#94a3b8">
        El modo Mosaico calcula matemáticamente las intersecciones vectoriales y añade una zona de solapamiento de seguridad (15 mm) para que cualquier usuario pueda imprimir pósters de calidad profesional sin contar con un plotter industrial.
      </text>
    </g>
  </g>
</svg>