<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="1020" height="340" style="background:#0f172a; font-family:sans-serif;">
  <defs>
    <!-- 1. BUG ANTERIOR (EL QUE MOSTRÓ EL USUARIO EN LA FOTO) -->
    <pattern id="pat-bug" width="54.0" height="31.17691453623979" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="#ffffff" />
      <path d="M 0 15.588457268119894 L 9.0 0 L 27.0 0 L 36.0 15.588457268119894 L 27.0 31.17691453623979 L 9.0 31.17691453623979 Z M 36.0 15.588457268119894 L 45.0 0 M 36.0 15.588457268119894 L 45.0 31.17691453623979 M 54.0 15.588457268119894 L 45.0 0 M 54.0 15.588457268119894 L 45.0 31.17691453623979"
            fill="none" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.8" />
    </pattern>

    <!-- 2. CORREGIDO FLAT-TOPPED (PANAL PERFECTO 100% REGULAR) -->
    <pattern id="pat-flat-clean" width="54.0" height="31.17691453623979" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="#ffffff" />
      <path d="M 0,15.588457268119894 L 9.0,0 L 27.0,0 L 36.0,15.588457268119894 L 27.0,31.17691453623979 L 9.0,31.17691453623979 Z M 36.0,15.588457268119894 L 54.0,15.588457268119894"
            fill="none" stroke="#2563eb" stroke-width="1.3" stroke-opacity="0.9" />
    </pattern>

    <!-- 3. CORREGIDO POINTY-TOPPED (PANAL VERTICAL DE COLMENA NATURAL) -->
    <pattern id="pat-pointy-clean" width="31.17691453623979" height="54.0" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="#ffffff" />
      <path d="M 15.588457268119894,0 L 31.17691453623979,9.0 L 31.17691453623979,27.0 L 15.588457268119894,36.0 L 0,27.0 L 0,9.0 Z M 15.588457268119894,36.0 L 15.588457268119894,54.0"
            fill="none" stroke="#059669" stroke-width="1.3" stroke-opacity="0.9" />
    </pattern>
  </defs>

  <!-- Título -->
  <text x="510" y="30" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">
    DIAGNÓSTICO Y CORRECCIÓN: TRAMA PANAL (HONEYCOMB / HEXÁGONOS)
  </text>

  <!-- Panel 1: Bug anterior -->
  <g transform="translate(20, 50)">
    <text x="160" y="20" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">
      ❌ Anterior (Tu captura: rombos intercalados)
    </text>
    <rect x="0" y="30" width="320" height="240" rx="8" fill="url(#pat-bug)" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="220" fill="#fca5a5" font-size="11" text-anchor="middle">
      Vértice conectado erróneamente al centro (2.5s, 0)
    </text>
  </g>

  <!-- Panel 2: Flat-topped perfecto -->
  <g transform="translate(360, 50)">
    <text x="160" y="20" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">
      ✔ Corregido Flat-topped (Horizontal)
    </text>
    <rect x="0" y="30" width="320" height="240" rx="8" fill="url(#pat-flat-clean)" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="220" fill="#93c5fd" font-size="11" text-anchor="middle">
      100% hexágonos regulares, 0 rombos
    </text>
  </g>

  <!-- Panel 3: Pointy-topped perfecto -->
  <g transform="translate(700, 50)">
    <text x="160" y="20" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">
      ✔ Corregido Pointy-topped (Vertical)
    </text>
    <rect x="0" y="30" width="320" height="240" rx="8" fill="url(#pat-pointy-clean)" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="220" fill="#6ee7b7" font-size="11" text-anchor="middle">
      Colmena natural con paredes verticales
    </text>
  </g>
</svg>