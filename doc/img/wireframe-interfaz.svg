      <rect x="1056" y="308" width="44" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="1078" y="344" text-anchor="middle">Trama</text>
      <rect x="1104" y="308" width="44" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="1126" y="344" text-anchor="middle">Imag.</text>
      <rect x="1152" y="308" width="44" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="4 3"/><text x="1174" y="344" text-anchor="middle">Tr.</text>
