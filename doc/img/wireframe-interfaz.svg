    <rect x="1064" y="101" width="128" height="22" rx="11" fill="#052e16"/>
    <text x="1128" y="116" font-size="11" text-anchor="middle" fill="#34d399">● Offline</text>

    <!-- ToolBar h-11 -->
    <rect x="32" y="132" width="1176" height="44" fill="#ffffff"/>
    <g font-size="11" fill="#334155">
      <rect x="48" y="142" width="64" height="24" rx="8" fill="#eff6ff"/><text x="80" y="158" text-anchor="middle">+ Hijo</text>
