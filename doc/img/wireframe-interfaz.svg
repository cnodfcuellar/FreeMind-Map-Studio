      <rect x="1034" y="252" width="43" height="26" fill="#f8fafc" stroke="#e2e8f0"/><text x="1040" y="268">Notas</text>
      <rect x="1077" y="252" width="43" height="26" fill="#f8fafc" stroke="#e2e8f0"/><text x="1083" y="268">Icon.</text>
      <rect x="1120" y="252" width="43" height="26" fill="#f8fafc" stroke="#e2e8f0"/><text x="1125" y="268">Nubes</text>
      <rect x="1163" y="252" width="45" height="26" fill="#f8fafc" stroke="#e2e8f0"/><text x="1169" y="268">Tema</text>
