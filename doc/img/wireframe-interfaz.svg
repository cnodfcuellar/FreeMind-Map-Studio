    <rect x="1108" y="142" width="84" height="24" rx="8" fill="#2563eb"/>
    <text x="1150" y="158" font-size="11" text-anchor="middle" fill="#fff">Exportar</text>

    <!-- FilterBar h-10 dark -->
    <rect x="32" y="176" width="1176" height="40" fill="#0f172a"/>
    <text x="48" y="201" font-size="12" fill="#cbd5e1">🔍 Ctrl+F</text>
    <rect x="130" y="184" width="220" height="24" rx="8" fill="#1e293b"/>
    <text x="142" y="200" font-size="11" fill="#64748b">Buscar…  Tags  Progreso  ✕</text>
    <text x="1050" y="201" font-size="11" fill="#93c5fd">3 resultados · ancestros/desc.</text>

    <!-- OutlineView left w-80 -->
