    <circle cx="596" cy="404" r="10" fill="#2563eb"/>
    <text x="596" y="408" font-size="12" text-anchor="middle" fill="#fff">+</text>
    <!-- slide frame overlay -->
    <rect x="670" y="280" width="260" height="260" rx="12" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="670" y="280" width="70" height="20" rx="6" fill="#2563eb"/>
    <text x="705" y="294" font-size="10" text-anchor="middle" fill="#fff">Slide 1</text>

    <!-- MiniMap -->
