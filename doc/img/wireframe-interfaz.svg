    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.45"/>
    </pattern>
    <rect x="232" y="216" width="716" height="472" fill="url(#dots)"/>
    <!-- edges -->
    <g stroke="#3b82f6" stroke-width="2.5" fill="none">
      <path d="M590 430 C 640 430, 640 360, 690 360"/>
      <path d="M590 430 C 640 430, 640 500, 690 500"/>
      <path d="M780 360 C 810 360, 810 320, 840 320"/>
    </g>
    <!-- nodes -->
    <rect x="500" y="408" width="90" height="48" rx="16" fill="#2563eb"/>
    <text x="545" y="436" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">RAÍZ</text>
    <rect x="690" y="338" width="90" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="735" y="364" font-size="12" text-anchor="middle" fill="#1e293b">Rama A</text>
    <rect x="690" y="478" width="90" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="735" y="504" font-size="12" text-anchor="middle" fill="#1e293b">Rama B</text>
