<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <rect width="1240" height="800" rx="16" fill="#0f172a"/>
  <text x="32" y="42" font-size="24" font-weight="700" fill="#ffffff">FreeMind Map Studio — Wireframe de la interfaz</text>
  <text x="32" y="68" font-size="13" fill="#93c5fd">MenuBar · ToolBar · FilterBar · Outline · Canvas · ToolPanel · StatusBar · MiniMap</text>

  <!-- App window -->
  <g>
    <rect x="32" y="92" width="1176" height="676" rx="12" fill="#f1f5f9"/>

    <!-- MenuBar h-10 dark -->
