      <rect x="198" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="213" y="158" text-anchor="middle">✂</text>
      <rect x="232" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="247" y="158" text-anchor="middle">⧉</text>
      <rect x="282" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="297" y="158" text-anchor="middle">◈</text>
      <rect x="316" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="331" y="158" text-anchor="middle">☁</text>
      <rect x="366" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="381" y="158" text-anchor="middle">↺</text>
      <rect x="400" y="142" width="30" height="24" rx="8" fill="#f1f5f9"/><text x="415" y="158" text-anchor="middle">↻</text>
      <rect x="450" y="142" width="90" height="24" rx="8" fill="#f1f5f9"/><text x="495" y="158" text-anchor="middle">−  100%  +</text>
