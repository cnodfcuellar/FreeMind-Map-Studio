    <rect x="960" y="384" width="60" height="18" rx="5" fill="#fff" stroke="#e2e8f0"/>
    <rect x="964" y="388" width="10" height="10" rx="2" fill="#2563eb"/>
    <text x="978" y="397" font-size="9" font-family="monospace" fill="#64748b">#2563EB</text>
    <g>
      <rect x="960" y="408" width="26" height="26" rx="6" fill="#fff" stroke="#e2e8f0"/>
      <rect x="990" y="408" width="26" height="26" rx="6" fill="#f0fdf4" stroke="#e2e8f0"/>
      <rect x="1020" y="408" width="26" height="26" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
      <rect x="1050" y="408" width="26" height="26" rx="6" fill="#059669" stroke="#e2e8f0"/>
      <rect x="1080" y="408" width="26" height="26" rx="6" fill="#d97706" stroke="#e2e8f0"/>
      <rect x="1110" y="408" width="26" height="26" rx="6" fill="#dc2626" stroke="#e2e8f0"/>
      <rect x="1140" y="408" width="26" height="26" rx="6" fill="#7c3aed" stroke="#e2e8f0"/>
      <rect x="1170" y="408" width="26" height="26" rx="6" fill="#0f172a" stroke="#e2e8f0"/>
    </g>
    <text x="960" y="456" font-size="10" font-weight="700" fill="#94a3b8">BORDES Y CONTORNO</text>
    <rect x="960" y="464" width="236" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="960" y="464" width="60" height="14" rx="7" fill="#2563eb"/>
    <text x="960" y="500" font-size="10" font-weight="700" fill="#94a3b8">ARISTAS Y PROPAGACIÓN</text>
    <rect x="960" y="508" width="114" height="26" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1017" y="525" font-size="10" text-anchor="middle" fill="#1d4ed8">Aplicar a Hijos</text>
    <rect x="1082" y="508" width="114" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="1139" y="525" font-size="10" text-anchor="middle" fill="#475569">A Hermanos</text>
    <text x="960" y="560" font-size="10" fill="#94a3b8">Sliders · Toggles · ShapeSelector · TagManager…</text>

    <!-- StatusBar h-6 -->
    <rect x="32" y="688" width="1176" height="24" fill="#0f172a"/>
    <rect x="32" y="688" width="1176" height="12" rx="0" fill="#0f172a"/>
    <text x="48" y="705" font-size="11" fill="#94a3b8">Nodos: <tspan fill="#e2e8f0">28</tspan>   Selec.: <tspan fill="#e2e8f0">"Raíz"</tspan>   Zoom: <tspan fill="#e2e8f0">100%</tspan>   Modo: <tspan fill="#e2e8f0">Listo</tspan></text>
    <rect x="32" y="700" width="1176" height="12" rx="6" fill="#0f172a"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#cbd5e1">
    <rect x="32" y="726" width="14" height="14" rx="4" fill="#0f172a" stroke="#64748b"/><text x="52" y="738">Barras oscuras fijas (h-10/h-11/h-6)</text>
    <rect x="340" y="726" width="14" height="14" rx="4" fill="#ffffff"/><text x="360" y="738">Superficies claras + borde slate-200</text>
    <rect x="660" y="726" width="14" height="14" rx="4" fill="#2563eb"/><text x="680" y="738">Primario / seleccionado (blue-600)</text>
