<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
      .name { font-size:12px; font-weight:800; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="16" fill="#0f172a"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">FilterBar — Medidas detalladas</text>
  <text x="32" y="62" font-size="12.5" fill="#93c5fd">Escala 1:1 (1px = 1px real) · FilterBar.tsx:33-117 · h-10 = 40px · px-4 = 16px</text>

  <!-- BARRA (escala 1:1) -->
  <rect x="60" y="96" width="1080" height="40" rx="6" fill="#0f172a" stroke="#334155"/>

  <!-- IZQUIERDA: Filtro Rápido + inputs -->
  <text x="132" y="120" font-size="10.5" text-anchor="middle" fill="#93c5fd" font-weight="700">Filtro Rápido:</text>
  <rect x="200" y="102" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="280" y="120" font-size="9.5" text-anchor="middle" fill="#64748b">Buscar por texto...</text>
  <rect x="372" y="102" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="437" y="120" font-size="9.5" text-anchor="middle" fill="#94a3b8">Etiquetas ▾</text>
  <rect x="514" y="102" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="584" y="120" font-size="9.5" text-anchor="middle" fill="#94a3b8">Progreso ▾</text>
  <rect x="666" y="104" width="94" height="24" rx="6" fill="#1e3a5f" stroke="#1e40af"/>
  <text x="713" y="120" font-size="9.5" text-anchor="middle" fill="#93c5fd">12 coincidencias</text>

  <!-- DERECHA: Limpiar + X -->
  <text x="1020" y="120" font-size="10" text-anchor="middle" fill="#94a3b8">Limpiar filtros</text>
  <rect x="1102" y="102" width="26" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1115" y="120" font-size="12" text-anchor="middle" fill="#94a3b8">✕</text>

  <!-- COTA ALTURA (x=42) -->
  <line x1="44" y1="96" x2="44" y2="136" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="38" y="118" class="cota-txt" text-anchor="end">40px</text>
  <text x="38" y="130" font-size="9" text-anchor="end" fill="#b45309">h-10</text>

  <!-- Padding lateral px-4 (16px) -->
  <line x1="60" y1="148" x2="76" y2="148" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="68" y="162" class="cota-txt" font-size="9" text-anchor="middle">16px</text>
  <text x="68" y="174" font-size="8.5" text-anchor="middle" fill="#b45309">px-4</text>

  <!-- Gap entre elementos (gap-3 = 12px) -->
  <line x1="360" y1="148" x2="372" y2="148" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="366" y="162" class="cota-txt" font-size="9" text-anchor="middle">12px</text>
  <text x="366" y="174" font-size="8.5" text-anchor="middle" fill="#b45309">gap-3</text>

  <!-- DESGLOSE: grupo izquierdo (flex-1 max-w-3xl) -->
  <text x="60" y="200" class="lbl" fill="#93c5fd">Grupo izquierdo: flex-1 · max-w-3xl (768px tope) · gap-3 (12px)</text>

  <!-- icono Buscar -->
  <rect x="60" y="216" width="24" height="24" rx="5" fill="#1e293b"/>
  <text x="72" y="232" font-size="11" text-anchor="middle" fill="#3b82f6">🔍</text>
  <text x="92" y="232" font-size="9.5" fill="#94a3b8">icono Buscar w-3.5 h-3.5 (14px)</text>

  <!-- input texto -->
  <rect x="60" y="256" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="180" y="274" font-size="9.5" text-anchor="middle" fill="#64748b">input query · max-w-xs (320px tope)</text>
  <line x1="60" y1="292" x2="300" y2="292" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="180" y="306" class="cota-txt" font-size="9" text-anchor="middle">flex-1 · tope max-w-xs = 320px</text>
  <text x="180" y="318" font-size="8.5" text-anchor="middle" fill="#b45309">px-2.5 py-1 · alto 28px · placeholder 12px</text>

  <!-- select etiquetas -->
  <rect x="340" y="256" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="405" y="274" font-size="9.5" text-anchor="middle" fill="#94a3b8">Todas las Etiquetas ▾</text>
  <text x="405" y="306" class="lbl-sm" text-anchor="middle">select tags · px-2 py-1 · alto 28px</text>
  <text x="405" y="318" font-size="8.5" text-anchor="middle" fill="#b45309">solo si availableTags.length &gt; 0</text>

  <!-- select progreso -->
  <rect x="500" y="256" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="274" font-size="9.5" text-anchor="middle" fill="#94a3b8">Cualquier Progreso ▾</text>
  <text x="580" y="306" class="lbl-sm" text-anchor="middle">select progreso · px-2 py-1 · alto 28px</text>
  <text x="580" y="318" font-size="8.5" text-anchor="middle" fill="#b45309">4 opciones: vacío, 100, ≥50, 0</text>

  <!-- contador -->
  <rect x="700" y="258" width="94" height="24" rx="6" fill="#1e3a5f" stroke="#1e40af"/>
  <text x="747" y="274" font-size="9.5" text-anchor="middle" fill="#93c5fd">12 coincidencias</text>
  <text x="747" y="306" class="lbl-sm" text-anchor="middle">badge contador · px-2 py-0.5</text>
  <text x="747" y="318" font-size="8.5" text-anchor="middle" fill="#b45309">solo al filtrar · icono Sparkles · text-[11px]</text>

  <!-- DESGASE: grupo derecho -->
  <text x="60" y="356" class="lbl" fill="#93c5fd">Grupo derecho: gap-2 (8px)</text>
  <rect x="60" y="372" width="94" height="22" rx="4" fill="none"/>
  <text x="107" y="387" font-size="10" text-anchor="middle" fill="#94a3b8">Limpiar filtros</text>
  <text x="107" y="410" class="lbl-sm" text-anchor="middle">link Limpiar · text-xs underline · solo al filtrar</text>

  <rect x="200" y="372" width="26" height="26" rx="6" fill="#1e293b"/>
  <text x="213" y="390" font-size="12" text-anchor="middle" fill="#94a3b8">✕</text>
  <text x="213" y="410" class="lbl-sm" text-anchor="middle">botón cerrar · p-1 · icono X w-4 h-4 (16px)</text>

  <!-- NOTA -->
  <text x="60" y="450" class="lbl-sm" fill="#93c5fd">Comportamiento: la barra se oculta con return null si isOpen=false · altura fija 40px (igual que MenuBar) · borde inferior slate-800</text>
  <text x="60" y="470" class="lbl-sm" fill="#93c5fd">Grupo izquierdo tope max-w-3xl (768px); input de texto tope max-w-xs (320px); selects y badge sin ancho fijo (según contenido)</text>
  <text x="60" y="490" class="lbl-sm" fill="#93c5fd">Animación: slide-in-from-top-2 duration-150 al abrir · text base text-xs (12px) · colores: fondo chrome-bar, texto blanco</text>

  <!-- NOTA RESPONSIVE -->
  <text x="60" y="530" class="lbl-sm" fill="#93c5fd">Nota: FilterBar no tiene media queries propias (sin hidden sm:/md:) — todos los controles siempre visibles cuando la barra está abierta</text>
</svg>
