  <text x="896" y="736" class="body">Tamaño persistido en localStorage: mindmap_minimap_size (default: compact)</text>
  <text x="896" y="758" class="body">Fondo tarjeta: var(--sp-glass, rgba(255,255,255,0.65)) + backdrop-blur-md + sombra 0 10px 25px</text>
