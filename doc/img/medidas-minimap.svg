  <!-- Desglose ZoomControls -->
  <text x="60" y="556" class="lbl" fill="#93c5fd">Desglose de ZoomControls</text>
  <rect x="60" y="566" width="768" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="588" class="body">Contenedor: p-1 (4px) · gap-1 (4px) · rounded-2xl · bg var(--sp-bg) · backdrop-blur-md · border slate-200/90</text>
  <text x="76" y="608" class="body">Botones: IconButton size=sm = w-7 h-7 (28x28) p-1.5 rounded-xl · iconos 14px (zoom) · Compass 16px</text>
  <text x="76" y="628" class="body">% zoom: px-2 py-0.5 text-xs font-mono tabular-nums (alto ~20px) · clic = 100% (Ctrl+0)</text>
  <text x="76" y="648" class="body">Separadores: w-[1px] h-4 (1x16px) mx-0.5 (2px) · antes de Compass (si hay onToggle) y de Ajustar</text>
  <text x="76" y="668" class="body">Orden: MiniMap (Compass) · | · ZoomOut · % · ZoomIn · | · Ajustar (Maximize2)</text>
  <text x="76" y="688" class="body">Alto total = 28 + 8 (p-1) = <tspan font-weight="700" fill="#b45309">36px</tspan> · Compass activo: bg-blue-50 text-blue-600</text>
  <text x="76" y="708" class="body">Tooltips: Ctrl + -, Ctrl + 0, Ctrl + + · variante ghost por defecto</text>

  <!-- Posicion compartida -->
