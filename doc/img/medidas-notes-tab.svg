  <!-- ============ COLUMNA DERECHA: detalles ============ -->

  <!-- Detalle 1: cabecera -->
  <text x="440" y="88" class="lbl" fill="#93c5fd">Cabecera — flex justify-between gap-2 flex-wrap · pb-1 border-b slate-200 (NotesTab:53)</text>
  <rect x="440" y="96" width="800" height="170" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="456" y="120" font-size="10" font-weight="700" fill="#94a3b8">NOTA MARKDOWN</text>
  <rect x="580" y="106" width="124" height="22" rx="8" fill="#f59e0b" stroke="#d97706"/>
  <rect x="585" y="111" width="11" height="11" rx="2" fill="#ffffff"/>
  <text x="645" y="120" font-size="8.5" font-weight="700" text-anchor="middle" fill="#ffffff">Debajo del Cuerpo ✓</text>
  <rect x="712" y="106" width="112" height="22" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="768" y="120" font-size="8.5" text-anchor="middle" fill="#475569">Mostrar en Nodo</text>
  <text x="456" y="150" class="body">Etiqueta: text-[10.5px] font-bold uppercase tracking-wider slate-400</text>
  <text x="456" y="172" class="body">Toggle showNoteInline (NotesTab:59-79): px-2 py-1 (8px/4px) rounded-lg text-[10.5px] font-semibold border shadow-2xs gap-1 icono 14px</text>
  <text x="456" y="194" class="body">ON (ámbar): bg-amber-500 text-white border-amber-600 → la nota se ve en el lienzo bajo el cuerpo (tooltips desactivados)</text>
  <text x="456" y="216" class="body">OFF (gris): bg-slate-100 slate-600 border-slate-200 hover:bg-slate-200 → tooltip en el nodo</text>
  <text x="456" y="238" class="body">Segmentado de vista (81-112): rounded-lg border bg-white p-0.5 · 3 botones p-1.5 rounded-md icono 14px · activo bg-blue-100 text-blue-700</text>
  <text x="456" y="256" class="body">Orden: Edit3 (editor) · Columns (dividida) · Eye (vista previa) · gap-1.5 (6px) con el toggle · flex-wrap si no cabe</text>

  <!-- Detalle 2: toolbar markdown -->
  <text x="440" y="292" class="lbl" fill="#93c5fd">Toolbar Markdown — solo en modo edit/split · flex gap-1 flex-wrap bg-slate-50 p-1.5 rounded-xl (NotesTab:118)</text>
  <rect x="440" y="300" width="800" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="456" y="314" width="304" height="28" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#475569">
    <text x="473" y="332">B</text>
    <text x="499" y="332" font-style="italic">I</text>
