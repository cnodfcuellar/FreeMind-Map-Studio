  <line x1="46" y1="126" x2="46" y2="138" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="40" y="135" class="cota-txt" font-size="9" text-anchor="end">12</text>
  <line x1="46" y1="138" x2="46" y2="166" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
