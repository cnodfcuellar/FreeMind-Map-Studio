  <text x="456" y="368" class="body">Botón: p-1 (4px) rounded · icono w-3.5 h-3.5 (14px) · hover bg-slate-200/80 · grupos: [Negrita Cursiva] | [H1 H2] | [Lista Num. Tarea] | [Código Cita]</text>
  <text x="456" y="390" class="body">handleInsertMarkdown (29-48): envuelve la selección (o placeholder) con prefijo/sufijo · sin selección usa el placeholder por defecto</text>
  <text x="456" y="412" class="body">Si no existe el textarea (#node-note-textarea), añade la línea al final de la nota · tras insertar: focus + selección del texto (setTimeout 0)</text>
  <text x="456" y="430" class="body">Placeholders: negrita · cursiva · Encabezado 1/2 · Elemento · Tarea · código · Cita</text>

  <!-- Detalle 3: editor y preview -->
  <text x="440" y="466" class="lbl" fill="#93c5fd">Editor (textarea) y vista previa — space-y-3 (12px) · NotesTab:198-221</text>
  <rect x="440" y="474" width="800" height="164" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="456" y="488" width="336" height="136" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="456" y="488" width="336" height="22" rx="12" fill="#f1f5f9"/>
  <text x="468" y="503" font-size="8.5" font-family="monospace" fill="#64748b">node-note-textarea (id fijo)</text>
  <g font-family="monospace" font-size="9" fill="#94a3b8">
    <text x="468" y="528">rows = 12 en modo edit · rows = 6 en split</text>
    <text x="468" y="546">w-full · p-3 (12px) · text-xs · font-mono</text>
    <text x="468" y="564">resize-y ↕ · leading-relaxed</text>
    <text x="468" y="582">focus:border-blue-500</text>
    <text x="468" y="600">placeholder: "Escribe notas en formato Markdown aquí..."</text>
  </g>
  <text x="816" y="504" class="body">textarea (200-207): alto ≈ rows × 20 + p-3 → edit ~260px · split ~140px</text>
  <text x="816" y="526" class="body">onChange escribe directo: onUpdateNode(note) · sin debounce</text>
  <text x="816" y="556" class="body">Preview (211-219): rounded-xl p-3 shadow-2xs</text>
  <text x="816" y="578" class="body">min-h-[120px] max-h-[350px] overflow-y-auto</text>
  <text x="816" y="600" class="body">Vacío: "Sin notas aún..." italic py-6 centrado text-xs</text>
  <text x="816" y="622" class="body">Con nota: &lt;MarkdownView&gt; (markdownRenderer)</text>

  <!-- Detalle 4: modos -->
  <text x="440" y="664" class="lbl" fill="#93c5fd">Modos de vista — estado local viewMode (NotesTab:27), default 'preview'</text>
  <rect x="440" y="672" width="800" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="456" y="696" class="body">preview (por defecto): solo se muestra la vista previa · toolbar y textarea ocultos</text>
  <text x="456" y="718" class="body">edit: toolbar + textarea con rows=12 (≈260px de alto) · sin preview</text>
  <text x="456" y="740" class="body">split: toolbar + textarea con rows=6 (≈140px) + preview apilados (space-y-3)</text>
  <text x="456" y="762" class="body">El toggle "Debajo del Cuerpo" (showNoteInline) es independiente del modo · se guarda en el nodo, no en localStorage</text>
</svg>
