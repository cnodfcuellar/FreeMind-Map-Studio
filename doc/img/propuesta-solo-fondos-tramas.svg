<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" style="background:#090d16; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1200" height="860" fill="#090d16" />
  <defs>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <pattern id="pat-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1e293b" />
      <circle cx="6" cy="6" r="1.8" fill="#38bdf8" opacity="0.8" />
      <circle cx="18" cy="18" r="1.8" fill="#38bdf8" opacity="0.8" />
    </pattern>
    <pattern id="pat-lines" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="#1e293b" />
      <line x1="0" y1="8" x2="20" y2="8" stroke="#38bdf8" stroke-width="1.4" opacity="0.75" />
    </pattern>
    <pattern id="pat-stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1e293b" />
      <line x1="0" y1="20" x2="20" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="10" y1="30" x2="30" y2="10" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    </pattern>
    <pattern id="pat-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#1e293b" />
      <path d="M 22,0 L 0,0 L 0,22" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.7" />
    </pattern>
    <pattern id="pat-isometric" width="34.64" height="20.0" patternUnits="userSpaceOnUse">
      <rect width="34.64" height="20.0" fill="#1e293b" />
      <line x1="0" y1="10.0" x2="34.64" y2="10.0" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="0" x2="34.64" y2="20.0" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="20.0" x2="34.64" y2="0" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
    </pattern>
    <pattern id="pat-diamonds" width="20.0" height="34.64" patternUnits="userSpaceOnUse">
      <rect width="20.0" height="34.64" fill="#1e293b" />
      <polygon points="10.0,0 20.0,17.32 10.0,34.64 0,17.32" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.8" />
    </pattern>
    <pattern id="pat-honeycomb" width="30.0" height="17.32" patternUnits="userSpaceOnUse">
      <rect width="30.0" height="17.32" fill="#1e293b" />
      <path d="M 0,8.66 L 5.0,0 L 15.0,0 L 20.0,8.66 L 15.0,17.32 L 5.0,17.32 Z" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.75" />
      <path d="M 15.0,0 L 20.0,8.66 L 30.0,8.66" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.75" />
    </pattern>
    <pattern id="pat-crosses" width="24.0" height="24.0" patternUnits="userSpaceOnUse">
      <rect width="24.0" height="24.0" fill="#1e293b" />
      <line x1="5.3" y1="12.0" x2="18.7" y2="12.0" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
      <line x1="12.0" y1="5.3" x2="12.0" y2="18.7" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
    </pattern>
  </defs>
  <g transform="translate(40, 24)">
    <rect width="1120" height="66" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="32" font-size="20" font-weight="800" fill="#f8fafc">🎨 Solo Fondos y Relleno de Nodos (§6.3)</text>
    <text x="28" y="52" font-size="12.5" fill="#94a3b8">8 Familias de Tramas Geométricas Matemáticas • Inspector sin elipsis • Cero bordes especiales</text>
    <rect x="990" y="18" width="102" height="30" rx="8" fill="#0284c7" />
    <text x="1041" y="38" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Solo Fondos</text>
  </g>
  <g transform="translate(40, 106)">
    <rect width="1120" height="295" rx="16" fill="#fcf9f2" stroke="#e7dec8" stroke-width="1.5" />
    <text x="28" y="32" font-size="14" font-weight="800" fill="#451a03">Panel de Propiedades — Sección "Fondo y Relleno"</text>
    <text x="28" y="50" font-size="11.5" fill="#78350f">Fila superior limpia con 5 botones sin textos cortados + cuadrícula 4×2 de tramados</text>
    <rect x="28" y="66" width="98" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="69" y="75" width="16" height="16" rx="3" fill="#2563eb" />
    <text x="77" y="108" font-size="11" font-weight="500" fill="#57534e" text-anchor="middle">Sólido</text>
    <rect x="133" y="66" width="98" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="174" y="75" width="16" height="16" rx="3" fill="#6366f1" />
    <text x="182" y="108" font-size="11" font-weight="500" fill="#57534e" text-anchor="middle">Gradiente</text>
    <rect x="238" y="66" width="98" height="52" rx="10" fill="#fdead7" stroke="#c2410c" stroke-width="1.8" />
    <g transform="translate(279, 76)">
      <line x1="0" y1="0" x2="16" y2="0" stroke="#c2410c" stroke-width="1.8" />
      <line x1="0" y1="5" x2="16" y2="5" stroke="#c2410c" stroke-width="1.8" />
      <line x1="0" y1="10" x2="16" y2="10" stroke="#c2410c" stroke-width="1.8" />
    </g>
    <text x="287" y="108" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">Trama</text>
    <rect x="343" y="66" width="98" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="384" y="75" width="16" height="16" rx="3" fill="none" stroke="#57534e" stroke-width="1.5" />
    <circle cx="388" cy="79" r="1.5" fill="#57534e" />
    <text x="392" y="108" font-size="11" font-weight="500" fill="#57534e" text-anchor="middle">Imagen</text>
    <rect x="448" y="66" width="98" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="489" y="75" width="16" height="16" rx="4" fill="none" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="3 2" />
    <text x="497" y="108" font-size="11" font-weight="500" fill="#57534e" text-anchor="middle">Ninguno</text>
    <rect x="28" y="150" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="40" y="160" width="32" height="32" rx="6" fill="url(#pat-dots)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="80" y="180" font-size="11.5" font-weight="500" fill="#57534e">Puntos</text>
    <rect x="160" y="150" width="124" height="52" rx="10" fill="#fdead7" stroke="#c2410c" stroke-width="1.8" />
    <rect x="172" y="160" width="32" height="32" rx="6" fill="url(#pat-lines)" stroke="#c2410c" stroke-width="1.2" />
    <text x="212" y="180" font-size="11.5" font-weight="700" fill="#9a3412">Líneas</text>
    <rect x="292" y="150" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="304" y="160" width="32" height="32" rx="6" fill="url(#pat-stripes)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="344" y="180" font-size="11.5" font-weight="500" fill="#57534e">Rayas</text>
    <rect x="424" y="150" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="436" y="160" width="32" height="32" rx="6" fill="url(#pat-grid)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="476" y="180" font-size="11.5" font-weight="500" fill="#57534e">Cuadros</text>
    <rect x="28" y="210" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="40" y="220" width="32" height="32" rx="6" fill="url(#pat-isometric)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="80" y="240" font-size="11.5" font-weight="500" fill="#57534e">Isométrico</text>
    <rect x="160" y="210" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="172" y="220" width="32" height="32" rx="6" fill="url(#pat-diamonds)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="212" y="240" font-size="11.5" font-weight="500" fill="#57534e">Rombos</text>
    <rect x="292" y="210" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="304" y="220" width="32" height="32" rx="6" fill="url(#pat-honeycomb)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="344" y="240" font-size="11.5" font-weight="500" fill="#57534e">Panal</text>
    <rect x="424" y="210" width="124" height="52" rx="10" fill="#ffffff" stroke="#e2d9c8" stroke-width="1" />
    <rect x="436" y="220" width="32" height="32" rx="6" fill="url(#pat-crosses)" stroke="#e2d9c8" stroke-width="1.2" />
    <text x="476" y="240" font-size="11.5" font-weight="500" fill="#57534e">Cruces</text>
    <g transform="translate(570, 66)">
      <rect width="522" height="200" rx="12" fill="#f4eee0" stroke="#e2d9c8" />
      <text x="20" y="28" font-size="13" font-weight="700" fill="#451a03">Parámetros del Fondo de Trama</text>
      <text x="20" y="52" font-size="11" fill="#78350f">• Color de Fondo Base: selector de color o paleta predefinida</text>
      <text x="20" y="74" font-size="11" fill="#78350f">• Color del Trazo de Trama: contraste de la textura sobre el fondo</text>
      <text x="20" y="96" font-size="11" fill="#78350f">• Tamaño de Trama (size): slider 8px – 40px (default 16px)</text>
      <text x="20" y="118" font-size="11" fill="#78350f">• Opacidad del Trazo (opacity): slider 10% – 100% (default 40%)</text>
      <rect x="20" y="136" width="482" height="46" rx="8" fill="#ffffff" stroke="#e2d9c8" />
      <text x="36" y="163" font-size="11" font-weight="700" fill="#15803d">✔ Sin elipsis en la fila superior: [Sólido] [Gradiente] [Trama] [Imagen] [Ninguno]</text>
    </g>
  </g>
  <g transform="translate(40, 420)">
    <rect width="1120" height="415" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="32" font-size="15" font-weight="800" fill="#38bdf8">Nodos Reales en el Lienzo con las 8 Familias de Trama</text>
    <text x="28" y="50" font-size="11.5" fill="#64748b">Cada nodo muestra su textura SVG pura en vivo, texto centrado legible y su fórmula de teselación</text>
    <g transform="translate(28, 70)">
      <rect width="256" height="110" rx="14" fill="url(#pat-dots)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">1. Puntos (dots)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Al tresbolillo quincunx</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">(0.25s, 0.25s) y (0.75s, 0.75s)</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(296, 70)">
      <rect width="256" height="110" rx="14" fill="url(#pat-lines)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">2. Líneas (lines)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Pautado horizontal</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">Línea centrada y = 0.5s</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(564, 70)">
      <rect width="256" height="110" rx="14" fill="url(#pat-stripes)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">3. Rayas (stripes)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Diagonales 45°</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">3 líneas desfasadas sin costuras C⁰</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(832, 70)">
      <rect width="256" height="110" rx="14" fill="url(#pat-grid)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">4. Cuadros (grid)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Cuadrícula ortogonal</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">Escuadra en L M(s,0)→L(0,0)→L(0,s)</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(28, 235)">
      <rect width="256" height="110" rx="14" fill="url(#pat-isometric)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">5. Isométrico (isometric)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Triángulos a 60°</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">W = s√3, H = s (malla 3D)</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(296, 235)">
      <rect width="256" height="110" rx="14" fill="url(#pat-diamonds)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">6. Rombos (diamonds)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Rómbico de Kepler</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">Rombo cerrado w = s, h = s√3</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(564, 235)">
      <rect width="256" height="110" rx="14" fill="url(#pat-honeycomb)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">7. Panal (honeycomb)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Hexágonos puros</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">Celda periódica 3s × s√3</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
    <g transform="translate(832, 235)">
      <rect width="256" height="110" rx="14" fill="url(#pat-crosses)" stroke="#0284c7" stroke-width="1.8" filter="url(#node-shadow)" />
      <rect x="24" y="22" width="208" height="66" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="128" y="44" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">8. Cruces (crosses)</text>
      <text x="128" y="60" font-size="10" fill="#38bdf8" text-anchor="middle">Cruces griegas</text>
      <text x="128" y="74" font-size="8.5" fill="#94a3b8" text-anchor="middle">Brazo perpendicular 0.28s</text>
      <text x="128" y="136" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">✔ Teselado Perfecto</text>
    </g>
  </g>
</svg>