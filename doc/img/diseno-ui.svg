<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <rect width="1240" height="980" rx="16" fill="#0f172a"/>
  <text x="620" y="52" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff">Cómo se ve la interfaz — guía visual</text>
  <text x="620" y="78" font-size="14" text-anchor="middle" fill="#93c5fd">3 ideas: zonas · colores con significado · estados de cada pieza</text>

  <!-- 1. ZONAS -->
  <text x="32" y="120" font-size="17" font-weight="800" fill="#38bdf8">1 · La pantalla son 8 zonas fijas</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="32" y="132" width="1176" height="46" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="620" y="160" fill="#e2e8f0">MenuBar oscura (menús + título + ● Offline)</text>
    <rect x="32" y="182" width="1176" height="46" rx="8" fill="#ffffff"/>
    <text x="620" y="210" fill="#0f172a">ToolBar clara (+Hijo · deshacer · zoom · Exportar azul)</text>
    <rect x="32" y="232" width="180" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="122" y="342" fill="#0f172a">Outline</text>
    <rect x="220" y="232" width="728" height="220" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="584" y="336" font-size="16" fill="#0f172a">Canvas infinito (nodos + aristas)</text>
    <text x="584" y="360" font-size="12" font-weight="400" fill="#64748b">MiniMap flotante abajo-derecha</text>
    <rect x="956" y="232" width="252" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1082" y="330" fill="#0f172a">ToolPanel</text>
    <text x="1082" y="352" font-size="11" font-weight="400" fill="#64748b">6 pestañas</text>
    <rect x="32" y="456" width="1176" height="40" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="620" y="481" fill="#e2e8f0">StatusBar oscura (nodos · selección · zoom · modo)</text>
  </g>

  <!-- 2. COLORES -->
  <text x="32" y="536" font-size="17" font-weight="800" fill="#38bdf8">2 · Cada color significa algo (no se mezclan)</text>
  <g font-size="13" font-weight="600">
    <rect x="32" y="548" width="270" height="64" rx="10" fill="#2563eb"/>
    <text x="167" y="574" text-anchor="middle" fill="#fff">AZUL = acción / activo</text>
    <text x="167" y="595" text-anchor="middle" font-size="11" font-weight="400" fill="#dbeafe">Botones, selección, focos</text>
    <rect x="318" y="548" width="270" height="64" rx="10" fill="#f59e0b"/>
    <text x="453" y="574" text-anchor="middle" fill="#fff">ÁMBAR = aviso / notas</text>
    <text x="453" y="595" text-anchor="middle" font-size="11" font-weight="400" fill="#fef3c7">Plegados, notas, búsqueda</text>
    <rect x="604" y="548" width="270" height="64" rx="10" fill="#e11d48"/>
    <text x="739" y="574" text-anchor="middle" fill="#fff">ROJO = peligro</text>
    <text x="739" y="595" text-anchor="middle" font-size="11" font-weight="400" fill="#ffe4e6">Borrar, errores</text>
    <rect x="890" y="548" width="318" height="64" rx="10" fill="#0f766e"/>
    <text x="1049" y="574" text-anchor="middle" fill="#fff">OSCURO = barras fijas</text>
    <text x="1049" y="595" text-anchor="middle" font-size="11" font-weight="400" fill="#ccfbf1">slate-900, nunca cambian</text>
  </g>

  <!-- 3. ESTADOS -->
  <text x="32" y="656" font-size="17" font-weight="800" fill="#38bdf8">3 · Todo tiene estados: normal → hover → seleccionado</text>
  <g>
    <text x="32" y="684" font-size="13" font-weight="700" fill="#cbd5e1">Botón:</text>
    <rect x="32" y="692" width="150" height="40" rx="12" fill="#f1f5f9"/>
    <text x="107" y="717" font-size="13" text-anchor="middle" fill="#334155">normal</text>
    <rect x="192" y="692" width="150" height="40" rx="12" fill="#e2e8f0"/>
    <text x="267" y="717" font-size="13" text-anchor="middle" fill="#334155">hover</text>
    <rect x="352" y="692" width="150" height="40" rx="12" fill="#2563eb"/>
    <text x="427" y="717" font-size="13" text-anchor="middle" fill="#fff">activo</text>

    <text x="560" y="684" font-size="13" font-weight="700" fill="#cbd5e1">Nodo:</text>
    <rect x="560" y="692" width="150" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="635" y="717" font-size="13" text-anchor="middle" fill="#334155">normal</text>
    <rect x="720" y="692" width="150" height="40" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="795" y="717" font-size="13" text-anchor="middle" fill="#1d4ed8">seleccionado</text>
    <rect x="880" y="692" width="150" height="40" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <text x="955" y="717" font-size="13" text-anchor="middle" fill="#92400e">búsqueda</text>

    <text x="32" y="762" font-size="13" font-weight="700" fill="#cbd5e1">Texto:</text>
    <text x="32" y="790" font-size="12" fill="#94a3b8">micro 10–11px (contadores, hex)</text>
    <text x="330" y="790" font-size="12" fill="#e2e8f0">normal 12px (paneles, botones)</text>
    <text x="620" y="792" font-size="16" font-weight="700" fill="#ffffff">grande (títulos, slides)</text>

    <text x="32" y="830" font-size="13" font-weight="700" fill="#cbd5e1">Esquinas y sombras crecen con importancia:</text>
    <rect x="32" y="840" width="220" height="44" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="142" y="867" font-size="12" text-anchor="middle" fill="#cbd5e1">chip pequeño · rounded-md</text>
    <rect x="264" y="840" width="220" height="44" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="374" y="867" font-size="12" text-anchor="middle" fill="#cbd5e1">botón · rounded-xl + sombra</text>
    <rect x="496" y="840" width="260" height="44" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="626" y="867" font-size="12" text-anchor="middle" fill="#fff">modal · rounded-2xl + sombra grande</text>
  </g>

  <rect x="32" y="906" width="1176" height="50" rx="10" fill="#1e3a8a"/>
  <text x="620" y="936" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Regla de oro: reutiliza átomos · azul = activo · detalle en doc/DESIGN.md</text>
</svg>
