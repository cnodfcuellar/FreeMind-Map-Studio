<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="100%" height="100%" style="background:#0f121d; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6d8cff" flood-opacity="0.5"/>
    </filter>

    <!-- Gradientes temáticos -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2030"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a324b"/>
      <stop offset="100%" stop-color="#1e2436"/>
    </linearGradient>
    <linearGradient id="bubbleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4f85"/>
      <stop offset="100%" stop-color="#243054"/>
    </linearGradient>
  </defs>

  <!-- Encabezado Principal -->
  <rect x="30" y="24" width="900" height="66" rx="12" fill="url(#bgGrad)" stroke="#2b3247" stroke-width="1"/>
  <text x="50" y="52" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.2">Cualidades Configurables de la Colita — Forma Burbuja (Bubble)</text>
  <text x="50" y="74" fill="#9097a8" font-size="12">Opciones de configuración anatómica para la forma bocadillo según las 4 características seleccionadas</text>

  <!-- ========================================== -->
  <!-- SECCIÓN 1: TAMAÑO DE LA COLITA -->
  <!-- ========================================== -->
  <g transform="translate(30, 105)">
    <!-- Contenedor de tarjeta -->
    <rect x="0" y="0" width="435" height="330" rx="12" fill="url(#bgGrad)" stroke="#2b3247" stroke-width="1"/>
    
    <!-- Header de sección -->
    <circle cx="28" cy="28" r="14" fill="#6d8cff" fill-opacity="0.15"/>
    <text x="28" y="33" fill="#6d8cff" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="52" y="32" fill="#f1f3f9" font-size="14" font-weight="700">Tamaño de la Colita (Largo y Ancho)</text>
    <text x="52" y="48" fill="#7e8699" font-size="11">Controla la longitud de la punta y la amplitud de su base</text>
    <line x1="20" y1="62" x2="415" y2="62" stroke="#252c3d" stroke-width="1"/>

    <!-- Ejemplo 1.1: Corta / Sutil -->
    <g transform="translate(25, 80)">
      <!-- Globo con colita corta (Largo: 6px, Base: 10px) -->
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 42,45 L 37,51 L 32,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Idea breve</text>
      <text x="57" y="72" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Corta / Discreta</text>
      <text x="57" y="86" fill="#80889c" font-size="10" text-anchor="middle">Largo: 6px · Base: 10px</text>
    </g>

    <!-- Ejemplo 1.2: Media / Estándar -->
    <g transform="translate(160, 80)">
      <!-- Globo con colita media (Largo: 12px, Base: 14px) -->
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 45,45 L 38,57 L 31,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleAccent)" stroke="#6d8cff" stroke-width="2" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Estándar</text>
      <text x="57" y="76" fill="#6d8cff" font-size="11" font-weight="700" text-anchor="middle">Media (Default)</text>
      <text x="57" y="90" fill="#80889c" font-size="10" text-anchor="middle">Largo: 12px · Base: 14px</text>
    </g>

    <!-- Ejemplo 1.3: Larga / Expresiva -->
    <g transform="translate(295, 80)">
      <!-- Globo con colita larga (Largo: 20px, Base: 18px) -->
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 48,45 L 39,66 L 30,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Énfasis</text>
      <text x="57" y="86" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Larga / Pronunciada</text>
      <text x="57" y="100" fill="#80889c" font-size="10" text-anchor="middle">Largo: 20px · Base: 18px</text>
    </g>

    <!-- Barra de control simulada -->
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="385" height="70" rx="8" fill="#141824" stroke="#252b3a" stroke-width="1"/>
      <text x="16" y="24" fill="#a0aec0" font-size="11" font-weight="600">Control sugerido en inspector:</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">Slider continuo de longitud</text>
      <rect x="180" y="40" width="140" height="6" rx="3" fill="#2d3748"/>
      <rect x="180" y="40" width="70" height="6" rx="3" fill="#6d8cff"/>
      <circle cx="250" cy="43" r="7" fill="#ffffff" stroke="#6d8cff" stroke-width="2"/>
      <rect x="330" y="34" width="42" height="18" rx="4" fill="#242b3d"/>
      <text x="351" y="47" fill="#6d8cff" font-size="10" font-weight="600" text-anchor="middle">12px</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECCIÓN 2: LADO DE SALIDA (ORIENTACIÓN) -->
  <!-- ========================================== -->
  <g transform="translate(495, 105)">
    <!-- Contenedor de tarjeta -->
    <rect x="0" y="0" width="435" height="330" rx="12" fill="url(#bgGrad)" stroke="#2b3247" stroke-width="1"/>
    
    <!-- Header de sección -->
    <circle cx="28" cy="28" r="14" fill="#6d8cff" fill-opacity="0.15"/>
    <text x="28" y="33" fill="#6d8cff" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="52" y="32" fill="#f1f3f9" font-size="14" font-weight="700">Lado de Salida (Orientación Cardinal)</text>
    <text x="52" y="48" fill="#7e8699" font-size="11">Define por qué cara del nodo emerge el pico del bocadillo</text>
    <line x1="20" y1="62" x2="415" y2="62" stroke="#252c3d" stroke-width="1"/>

    <!-- 2.1: Abajo (Bottom) -->
    <g transform="translate(30, 80)">
      <path d="M 8,0 L 72,0 Q 80,0 80,8 L 80,28 Q 80,36 72,36 L 46,36 L 40,46 L 34,36 L 8,36 Q 0,36 0,28 L 0,8 Q 0,0 8,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="40" y="22" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Abajo</text>
      <text x="40" y="64" fill="#a0aec0" font-size="10" text-anchor="middle">Inferior (↓)</text>
    </g>

    <!-- 2.2: Arriba (Top) -->
    <g transform="translate(125, 80)">
      <path d="M 8,10 L 34,10 L 40,0 L 46,10 L 72,10 Q 80,10 80,18 L 80,38 Q 80,46 72,46 L 8,46 Q 0,46 0,38 L 0,18 Q 0,10 8,10 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="40" y="32" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Arriba</text>
      <text x="40" y="64" fill="#a0aec0" font-size="10" text-anchor="middle">Superior (↑)</text>
    </g>

    <!-- 2.3: Izquierda (Left - Hacia nodo padre) -->
    <g transform="translate(220, 80)">
      <path d="M 18,0 L 76,0 Q 84,0 84,8 L 84,28 Q 84,36 76,36 L 18,36 Q 10,36 10,28 L 10,23 L 0,18 L 10,13 L 10,8 Q 10,0 18,0 Z" 
            fill="url(#bubbleAccent)" stroke="#6d8cff" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="47" y="22" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Izquierda</text>
      <text x="47" y="64" fill="#6d8cff" font-size="10" font-weight="600" text-anchor="middle">Apunta al padre (←)</text>
    </g>

    <!-- 2.4: Derecha (Right - Hacia hijos) -->
    <g transform="translate(325, 80)">
      <path d="M 8,0 L 66,0 Q 74,0 74,8 L 74,13 L 84,18 L 74,23 L 74,28 Q 74,36 66,36 L 8,36 Q 0,36 0,28 L 0,8 Q 0,0 8,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="37" y="22" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Derecha</text>
      <text x="37" y="64" fill="#a0aec0" font-size="10" text-anchor="middle">Apunta a hijos (→)</text>
    </g>

    <!-- Control sugerido en inspector -->
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="385" height="70" rx="8" fill="#141824" stroke="#252b3a" stroke-width="1"/>
      <text x="16" y="24" fill="#a0aec0" font-size="11" font-weight="600">Selector segmentado cardinal (design.md §5.7):</text>
      
      <!-- 4 botones cardinales en fila -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="82" height="28" rx="6" fill="#1e2436" stroke="#2e374d"/>
        <text x="41" y="18" fill="#a0aec0" font-size="10" text-anchor="middle">↑ Arriba</text>
        
        <rect x="90" y="0" width="82" height="28" rx="6" fill="#1e2436" stroke="#2e374d"/>
        <text x="131" y="18" fill="#a0aec0" font-size="10" text-anchor="middle">↓ Abajo</text>
        
        <rect x="180" y="0" width="86" height="28" rx="6" fill="#32416b" stroke="#6d8cff" stroke-width="1.5"/>
        <text x="223" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">← Izq (Padre)</text>
        
        <rect x="274" y="0" width="82" height="28" rx="6" fill="#1e2436" stroke="#2e374d"/>
        <text x="315" y="18" fill="#a0aec0" font-size="10" text-anchor="middle">→ Derecha</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECCIÓN 3: POSICIÓN EN EL BORDE -->
  <!-- ========================================== -->
  <g transform="translate(30, 455)">
    <!-- Contenedor de tarjeta -->
    <rect x="0" y="0" width="435" height="330" rx="12" fill="url(#bgGrad)" stroke="#2b3247" stroke-width="1"/>
    
    <!-- Header de sección -->
    <circle cx="28" cy="28" r="14" fill="#6d8cff" fill-opacity="0.15"/>
    <text x="28" y="33" fill="#6d8cff" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="52" y="32" fill="#f1f3f9" font-size="14" font-weight="700">Posición en el Borde (Desplazamiento)</text>
    <text x="52" y="48" fill="#7e8699" font-size="11">Desplaza la colita a la izquierda, centro o derecha del lado</text>
    <line x1="20" y1="62" x2="415" y2="62" stroke="#252c3d" stroke-width="1"/>

    <!-- 3.1: Inicio / Izquierda (20%) -->
    <g transform="translate(25, 80)">
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 35,45 L 28,56 L 21,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Alineada Inicio</text>
      <text x="57" y="74" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Inicio (20%)</text>
      <text x="57" y="88" fill="#80889c" font-size="10" text-anchor="middle">Tirada a la izquierda</text>
    </g>

    <!-- 3.2: Centro (50%) -->
    <g transform="translate(160, 80)">
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 65,45 L 57,56 L 49,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleAccent)" stroke="#6d8cff" stroke-width="2" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Centrada</text>
      <text x="57" y="74" fill="#6d8cff" font-size="11" font-weight="700" text-anchor="middle">Centro (50%)</text>
      <text x="57" y="88" fill="#80889c" font-size="10" text-anchor="middle">Equidistante simétrica</text>
    </g>

    <!-- 3.3: Fin / Derecha (80%) -->
    <g transform="translate(295, 80)">
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 95,45 L 88,56 L 81,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Alineada Fin</text>
      <text x="57" y="74" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Fin (80%)</text>
      <text x="57" y="88" fill="#80889c" font-size="10" text-anchor="middle">Tirada a la derecha</text>
    </g>

    <!-- Control sugerido en inspector -->
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="385" height="70" rx="8" fill="#141824" stroke="#252b3a" stroke-width="1"/>
      <text x="16" y="24" fill="#a0aec0" font-size="11" font-weight="600">Slider de alineación en el borde:</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">Desplazamiento (%)</text>
      <rect x="170" y="40" width="150" height="6" rx="3" fill="#2d3748"/>
      <rect x="170" y="40" width="75" height="6" rx="3" fill="#6d8cff"/>
      <circle cx="245" cy="43" r="7" fill="#ffffff" stroke="#6d8cff" stroke-width="2"/>
      <rect x="330" y="34" width="42" height="18" rx="4" fill="#242b3d"/>
      <text x="351" y="47" fill="#6d8cff" font-size="10" font-weight="600" text-anchor="middle">50%</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECCIÓN 4: ESTILO Y FORMA DE LA COLITA -->
  <!-- ========================================== -->
  <g transform="translate(495, 455)">
    <!-- Contenedor de tarjeta -->
    <rect x="0" y="0" width="435" height="330" rx="12" fill="url(#bgGrad)" stroke="#2b3247" stroke-width="1"/>
    
    <!-- Header de sección -->
    <circle cx="28" cy="28" r="14" fill="#6d8cff" fill-opacity="0.15"/>
    <text x="28" y="33" fill="#6d8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="52" y="32" fill="#f1f3f9" font-size="14" font-weight="700">Estilo Anatómico de la Colita</text>
    <text x="52" y="48" fill="#7e8699" font-size="11">Variaciones estilísticas y expresivas del bocadillo</text>
    <line x1="20" y1="62" x2="415" y2="62" stroke="#252c3d" stroke-width="1"/>

    <!-- 4.1: Recta / Triangular Clásica -->
    <g transform="translate(25, 80)">
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 45,45 L 37,58 L 30,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Diálogo</text>
      <text x="57" y="76" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Recta / Clásica</text>
      <text x="57" y="90" fill="#80889c" font-size="10" text-anchor="middle">Pico triangular directo</text>
    </g>

    <!-- 4.2: Curva / Dinámica -->
    <g transform="translate(160, 80)">
      <!-- Colita curva con bezier cúbica/cuadrática -->
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 45,45 Q 40,54 22,60 Q 34,51 32,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleAccent)" stroke="#6d8cff" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="57" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Expresivo</text>
      <text x="57" y="76" fill="#6d8cff" font-size="11" font-weight="700" text-anchor="middle">Curva / Dinámica</text>
      <text x="57" y="90" fill="#80889c" font-size="10" text-anchor="middle">Arqueada estilo cómic</text>
    </g>

    <!-- 4.3: Pensamiento (Burbujitas) -->
    <g transform="translate(295, 80)">
      <!-- Globo con burbujas de pensamiento -->
      <path d="M 10,0 L 105,0 Q 115,0 115,10 L 115,35 Q 115,45 105,45 L 10,45 Q 0,45 0,35 L 0,10 Q 0,0 10,0 Z" 
            fill="url(#bubbleGrad)" stroke="#6d8cff" stroke-width="1.6" filter="url(#shadow)"/>
      <!-- 3 bolitas decrecientes -->
      <circle cx="38" cy="52" r="5" fill="#2a324b" stroke="#6d8cff" stroke-width="1.5"/>
      <circle cx="31" cy="62" r="3.2" fill="#2a324b" stroke="#6d8cff" stroke-width="1.4"/>
      <circle cx="25" cy="70" r="1.8" fill="#6d8cff"/>
      <text x="57" y="27" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Pensamiento</text>
      <text x="57" y="86" fill="#6d8cff" font-size="11" font-weight="600" text-anchor="middle">Nube / Círculos</text>
      <text x="57" y="100" fill="#80889c" font-size="10" text-anchor="middle">Círculos decrecientes</text>
    </g>

    <!-- Control sugerido en inspector -->
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="385" height="70" rx="8" fill="#141824" stroke="#252b3a" stroke-width="1"/>
      <text x="16" y="24" fill="#a0aec0" font-size="11" font-weight="600">Botones de estilo de colita:</text>
      
      <!-- 3 botones de estilo -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="112" height="28" rx="6" fill="#1e2436" stroke="#2e374d"/>
        <text x="56" y="18" fill="#a0aec0" font-size="10" text-anchor="middle">▲ Recta</text>
        
        <rect x="122" y="0" width="112" height="28" rx="6" fill="#32416b" stroke="#6d8cff" stroke-width="1.5"/>
        <text x="178" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">~ Curva</text>
        
        <rect x="244" y="0" width="112" height="28" rx="6" fill="#1e2436" stroke="#2e374d"/>
        <text x="300" y="18" fill="#a0aec0" font-size="10" text-anchor="middle">○ Pensamiento</text>
      </g>
    </g>
  </g>
</svg>
