<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="660" viewBox="0 0 1460 660" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
      .name { font-size:12px; font-weight:800; }
    </style>
  </defs>

  <rect width="1460" height="660" rx="16" fill="#0f172a"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">ToolBar — Medidas detalladas</text>
  <text x="32" y="62" font-size="12.5" fill="#93c5fd">Escala 1:1 (1px = 1px real) · ToolBar.tsx:124-640 · h-11 = 44px · botones 30×30px</text>

  <!-- BARRA (escala 1:1) -->
  <rect x="60" y="96" width="1356" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- GRUPO IZQUIERDO (acciones de nodo + historial) -->
  <!-- Undo / Redo -->
  <rect x="70" y="103" width="30" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="123" font-size="12" text-anchor="middle" fill="#64748b">↶</text>
  <rect x="102" y="103" width="30" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="117" y="123" font-size="12" text-anchor="middle" fill="#64748b">↷</text>
  <!-- separador -->
  <line x1="140" y1="108" x2="140" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Hijo / Hermano -->
  <rect x="150" y="105" width="62" height="26" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="181" y="122" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="700">+ Hijo</text>
  <rect x="216" y="105" width="82" height="26" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="257" y="122" font-size="10.5" text-anchor="middle" fill="#334155" font-weight="600">+ Hermano</text>
  <!-- Delete / Fold -->
  <rect x="304" y="103" width="30" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="319" y="123" font-size="12" text-anchor="middle" fill="#dc2626">🗑</text>
  <rect x="336" y="103" width="30" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="351" y="123" font-size="12" text-anchor="middle" fill="#64748b">⤡</text>
  <!-- separador -->
  <line x1="374" y1="108" x2="374" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Negrita / Cursiva -->
  <rect x="384" y="103" width="30" height="30" rx="7" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="399" y="123" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="800">B</text>
  <rect x="416" y="103" width="30" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="431" y="123" font-size="12" text-anchor="middle" fill="#64748b" font-style="italic">I</text>
  <!-- select Forma -->
  <rect x="452" y="105" width="105" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="122" font-size="10" text-anchor="middle" fill="#475569">Forma ▾</text>
  <!-- separador -->
  <line x1="567" y1="108" x2="567" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Conector / Nube -->
  <rect x="577" y="105" width="86" height="26" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="122" font-size="10.5" text-anchor="middle" fill="#0891b2">🔗 Conector</text>
  <rect x="667" y="105" width="58" height="26" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="696" y="122" font-size="10.5" text-anchor="middle" fill="#d97706">☁ Nube</text>
  <!-- Iconos SVG -->
  <rect x="729" y="105" width="96" height="26" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="777" y="122" font-size="10.5" text-anchor="middle" fill="#2563eb">★ Iconos SVG</text>
  <!-- Menú móvil "Más" (oculto ≥md) -->
  <rect x="831" y="103" width="30" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="846" y="123" font-size="12" text-anchor="middle" fill="#94a3b8">⋯</text>

  <!-- GRUPO DERECHO (modos y paneles) -->
  <!-- Buscar -->
  <rect x="1000" y="103" width="30" height="30" rx="7" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="1015" y="123" font-size="12" text-anchor="middle" fill="#1d4ed8">🔍</text>
  <!-- Vista (ojo) -->
  <rect x="1032" y="105" width="62" height="26" rx="7" fill="#fef3c7" stroke="#fde68a"/>
  <text x="1063" y="122" font-size="10.5" text-anchor="middle" fill="#92400e">👁 Vista ▾</text>
  <!-- Esquema -->
  <rect x="1098" y="105" width="70" height="26" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="1133" y="122" font-size="10.5" text-anchor="middle" fill="#4338ca">Esquema</text>
  <!-- Presentar -->
  <rect x="1172" y="105" width="78" height="26" rx="7" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="1211" y="122" font-size="10.5" text-anchor="middle" fill="#6d28d9">Presentar ▾</text>
  <!-- Exportar (primario) -->
  <rect x="1254" y="105" width="92" height="26" rx="7" fill="#2563eb"/>
  <text x="1300" y="122" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="700">⬇ Exportar</text>
  <!-- Panel de Propiedades -->
  <rect x="1350" y="103" width="30" height="30" rx="7" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="1365" y="123" font-size="12" text-anchor="middle" fill="#1d4ed8">⚙</text>
  <!-- (el desglose inferior detalla cada botón del grupo derecho) -->

  <!-- COTA ALTURA (x=42) -->
  <line x1="44" y1="96" x2="44" y2="140" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="38" y="121" class="cota-txt" text-anchor="end">44px</text>
  <text x="38" y="133" font-size="9" text-anchor="end" fill="#b45309">h-11</text>

  <!-- Padding lateral px-2 sm:px-3 (8 / 12px) -->
  <line x1="60" y1="152" x2="70" y2="152" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="65" y="166" class="cota-txt" font-size="9" text-anchor="middle">12px</text>
  <text x="65" y="178" font-size="8.5" text-anchor="middle" fill="#b45309">px-3</text>

  <!-- Gap entre botones (gap-1 sm:gap-2) -->
  <line x1="96" y1="152" x2="102" y2="152" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="99" y="166" class="cota-txt" font-size="9" text-anchor="middle">4px</text>
  <text x="99" y="178" font-size="8.5" text-anchor="middle" fill="#b45309">gap-1</text>

  <!-- DESGLOSE: botones de icono 30x30 -->
  <text x="60" y="212" class="lbl" fill="#93c5fd">Botón de icono = 30×30px (min-w/min-h) · p-1.5 (6px) · icono w-4 h-4 (16px)</text>
  <rect x="60" y="224" width="30" height="30" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="66" y="230" width="18" height="18" rx="3" fill="#e2e8f0"/>
  <line x1="60" y1="262" x2="60" y2="270" class="cota"/><line x1="90" y1="262" x2="90" y2="270" class="cota"/>
  <line x1="60" y1="266" x2="90" y2="266" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="75" y="280" class="cota-txt" font-size="9" text-anchor="middle">30px</text>
  <line x1="98" y1="230" x2="98" y2="248" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="104" y="242" class="cota-txt" font-size="9">16px icono</text>

  <!-- Botón con texto (px-2.5 py-1.5) -->
  <rect x="180" y="224" width="62" height="26" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="211" y="241" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="700">+ Hijo</text>
  <line x1="180" y1="258" x2="242" y2="258" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="211" y="272" class="cota-txt" font-size="9" text-anchor="middle">~62px (px-2.5 + texto)</text>
  <text x="211" y="284" font-size="8.5" text-anchor="middle" fill="#b45309">py-1.5 = 6px · alto 26px</text>

  <!-- Separador w-px h-5 (1×20px) -->
  <line x1="300" y1="226" x2="300" y2="246" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="250" x2="300" y2="258" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="306" y="258" class="cota-txt" font-size="9">20px · w-px h-5</text>

  <!-- DESGLOSE: select Forma -->
  <text x="60" y="316" class="lbl" fill="#93c5fd">Select Forma (sm+) · px-2 py-1 · text-xs · tope max-w-[105px] (md: sin tope)</text>
  <rect x="60" y="328" width="105" height="26" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="112" y="345" font-size="10" text-anchor="middle" fill="#475569">Burbuja ▾</text>
  <line x1="60" y1="362" x2="165" y2="362" class="cota" marker-start="url(#cap)" marker-end="url(#cap)"/>
  <text x="112" y="376" class="cota-txt" font-size="9" text-anchor="middle">105px (tope)</text>

  <!-- POPOVER Visibilidad (w-64 = 256px) -->
  <text x="340" y="212" class="lbl" fill="#93c5fd">Popover "Vista" = Visibilidad Global (w-64)</text>
  <rect x="340" y="224" width="256" height="176" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="468" y="242" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Visibilidad Global · w-64 = 256px</text>
  <line x1="352" y1="250" x2="584" y2="250" stroke="#e2e8f0"/>
  <g font-size="9.5" fill="#334155">
    <text x="356" y="266">Cuerpos / Explicación <tspan fill="#059669">Visible</tspan></text>
    <text x="356" y="284">Imágenes adjuntas <tspan fill="#7c3aed">Visible</tspan></text>
    <text x="356" y="302">Etiquetas (#Tags) <tspan fill="#d97706">Visible</tspan></text>
    <text x="356" y="320">Iconos temáticos <tspan fill="#2563eb">Visible</tspan></text>
    <text x="356" y="338">Insignias de enlace <tspan fill="#0891b2">Visible</tspan></text>
  </g>
  <text x="468" y="362" class="lbl-sm" text-anchor="middle">ítem: px-2.5 py-2 → alto 34px · badge text-[10px]</text>
  <text x="468" y="378" class="lbl-sm" text-anchor="middle">anclado right-0 top-full mt-1.5 (6px) · p-2</text>

  <!-- POPOVER Presentar (w-72 = 288px) -->
  <text x="640" y="212" class="lbl" fill="#93c5fd">Popover "Presentar" = Tipos de Presentación (w-72)</text>
  <rect x="640" y="224" width="288" height="196" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="784" y="242" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Tipos de Presentación · w-72 = 288px</text>
  <line x1="652" y1="250" x2="916" y2="250" stroke="#e2e8f0"/>
  <!-- tarjeta 1 -->
  <rect x="652" y="258" width="32" height="32" rx="8" fill="#ede9fe"/>
  <text x="668" y="279" font-size="12" text-anchor="middle" fill="#6d28d9">▤</text>
  <text x="692" y="270" font-size="10" fill="#0f172a" font-weight="700">Clásico <tspan fill="#059669" font-size="8.5">Activo</tspan></text>
  <text x="692" y="282" font-size="8.5" fill="#64748b">Diapositivas paso a paso</text>
  <!-- tarjeta 2 -->
  <rect x="652" y="298" width="32" height="32" rx="8" fill="#e0e7ff"/>
  <text x="668" y="319" font-size="12" text-anchor="middle" fill="#4338ca">◈</text>
  <text x="692" y="310" font-size="10" fill="#0f172a" font-weight="700">Elaborado (Espacial) <tspan fill="#059669" font-size="8.5">Activo</tspan></text>
  <text x="692" y="322" font-size="8.5" fill="#64748b">Lienzo libre, rotación</text>
  <!-- tarjeta 3 -->
  <rect x="652" y="338" width="32" height="32" rx="8" fill="#fce7f3"/>
  <text x="668" y="359" font-size="12" text-anchor="middle" fill="#be185d">⚡</text>
  <text x="692" y="350" font-size="10" fill="#0f172a" font-weight="700">Dinámico (Mindomo) <tspan fill="#059669" font-size="8.5">Activo</tspan></text>
  <text x="692" y="362" font-size="8.5" fill="#64748b">Vuelo de cámara sobre lienzo</text>
  <text x="784" y="392" class="lbl-sm" text-anchor="middle">tarjeta: p-2 rounded-xl · icono w-8 h-8 (32px) · desc text-[11px]</text>
  <text x="784" y="408" class="lbl-sm" text-anchor="middle">badge "Activo" text-[9px] · anclado right-0 top-full mt-1.5</text>

  <!-- MENÚ MÓVIL "Más" (w-52 = 208px) -->
  <text x="60" y="428" class="lbl" fill="#93c5fd">Menú móvil "Más" (oculto ≥ md) = w-52</text>
  <rect x="60" y="440" width="208" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="164" y="458" class="name" font-size="11" text-anchor="middle" fill="#0f172a">Formato &amp; Enlaces · w-52 = 208px</text>
  <line x1="72" y1="466" x2="256" y2="466" stroke="#e2e8f0"/>
  <text x="76" y="482" font-size="9.5" fill="#334155">Forma: [select 10 formas]</text>
  <line x1="72" y1="490" x2="256" y2="490" stroke="#e2e8f0"/>
  <rect x="76" y="498" width="80" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="512" font-size="9" text-anchor="middle" fill="#1d4ed8">Negrita</text>
  <rect x="164" y="498" width="80" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="204" y="512" font-size="9" text-anchor="middle" fill="#475569" font-style="italic">Cursiva</text>
  <line x1="72" y1="526" x2="256" y2="526" stroke="#e2e8f0"/>
  <text x="76" y="542" font-size="9.5" fill="#0891b2">Crear Conector flotante</text>
  <text x="76" y="560" font-size="9.5" fill="#d97706">Alternar Nube de agrupación</text>
  <text x="164" y="580" class="lbl-sm" text-anchor="middle">ítem: px-3 py-1.5 · encabezado text-[10px]</text>

  <!-- DERECHA: botones de modos -->
  <text x="380" y="428" class="lbl" fill="#93c5fd">Grupo derecho (modos y paneles)</text>
  <rect x="380" y="440" width="30" height="30" rx="7" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="395" y="460" font-size="12" text-anchor="middle" fill="#1d4ed8">🔍</text>
  <text x="418" y="459" font-size="9.5" fill="#334155">Buscar (Ctrl+F) · 30×30 · activo azul</text>

  <rect x="380" y="478" width="62" height="26" rx="7" fill="#fef3c7" stroke="#fde68a"/>
  <text x="411" y="495" font-size="10.5" text-anchor="middle" fill="#92400e">👁 Vista ▾</text>
  <text x="450" y="495" font-size="9.5" fill="#334155">ojo + label "Vista" (lg+) + chevron 12px · px-2.5 py-1.5</text>

  <rect x="380" y="516" width="70" height="26" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="415" y="533" font-size="10.5" text-anchor="middle" fill="#4338ca">Esquema</text>
  <text x="458" y="533" font-size="9.5" fill="#334155">Alt+O · label "Esquema" (md+) · activo índigo</text>

  <rect x="380" y="554" width="78" height="26" rx="7" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="419" y="571" font-size="10.5" text-anchor="middle" fill="#6d28d9">Presentar ▾</text>
  <text x="466" y="571" font-size="9.5" fill="#334155">F5 · label "Presentar" (lg+) · popover w-72</text>

  <!-- Exportar (primario) -->
  <rect x="700" y="440" width="92" height="26" rx="7" fill="#2563eb"/>
  <text x="746" y="457" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="700">⬇ Exportar</text>
  <text x="800" y="457" font-size="9.5" fill="#334155">px-3 py-1.5 · label oculto &lt; sm · bg-blue-600</text>

  <!-- separador + ToolPanel -->
  <line x1="700" y1="486" x2="700" y2="506" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="720" y="486" width="30" height="30" rx="7" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="735" y="506" font-size="12" text-anchor="middle" fill="#1d4ed8">⚙</text>
  <text x="758" y="505" font-size="9.5" fill="#334155">Panel Propiedades (Alt+P) · 30×30 · activo azul</text>

  <!-- NOTA RESPONSIVE -->
  <text x="60" y="620" class="lbl-sm" fill="#93c5fd">Responsivo: label "Hijo/Hermano" oculto &lt; sm(640px) · "Vista/Presentar" oculto &lt; lg(1024px) · "Esquema/Conector/Nube/Iconos" oculto &lt; md(768px) · select Forma y Bold/Italic ocultos &lt; sm · badge "500+" solo ≥ xl(1280px)</text>
  <text x="60" y="640" class="lbl-sm" fill="#93c5fd">Grupos separados por justify-between · gap-1 (4px) entre botones, gap-2 (8px) entre grupos · separadores w-px h-5 (1×20px) con mx-0.5/mx-1 (2-4px)</text>
</svg>
