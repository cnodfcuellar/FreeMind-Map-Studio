  <!-- FILA INFERIOR: DETALLE DE LAS 3 FASES DE CONTENIDO (y: 720 a 920)        -->
  <!-- ========================================================================= -->
  <text x="50" y="728" font-size="14" font-weight="800" fill="#38bdf8">Estructura Modular de Diapositivas — Las 3 Fases Automáticas de Cada Nodo:</text>

  <!-- FASE 1: Spotlight (Título, Cuerpo, Imagen) -->
  <g transform="translate(50, 742)">
    <rect width="280" height="185" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="12" y="12" width="105" height="20" rx="6" fill="#1e40af"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#93c5fd">Fase 1: Spotlight</text>
    <text x="12" y="52" font-size="12" font-weight="700" fill="#ffffff">Título + Cuerpo (+ Imagen)</text>
    <text x="12" y="72" font-size="10.5" fill="#94a3b8">· Encabezado adaptativo (3xl..7xl)</text>
    <text x="12" y="88" font-size="10.5" fill="#94a3b8">· Paginación automática si &gt;450 car.</text>
    <text x="12" y="104" font-size="10.5" fill="#94a3b8">· Imagen fija (S:144, M:240, L:320px)</text>
    <text x="12" y="120" font-size="10.5" fill="#94a3b8">· Badges de etiquetas y % progreso</text>
    <rect x="12" y="142" width="256" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="161" font-size="10" font-weight="600" fill="#38bdf8">Layout: Grid 12 cols (img:5 / txt:7)</text>
  </g>

  <!-- FASE 2: Notas Markdown -->
  <g transform="translate(350, 742)">
    <rect width="280" height="185" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="12" y="12" width="100" height="20" rx="6" fill="#78350f"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#fde68a">Fase 2: Notas</text>
    <text x="12" y="52" font-size="12" font-weight="700" fill="#ffffff">Notas del Presentador</text>
    <text x="12" y="72" font-size="10.5" fill="#94a3b8">· Barra de contexto con thumbnail</text>
    <text x="12" y="88" font-size="10.5" fill="#94a3b8">· Tarjeta central max-w-4xl (896px)</text>
    <text x="12" y="104" font-size="10.5" fill="#94a3b8">· MarkdownView completo formateado</text>
    <text x="12" y="120" font-size="10.5" fill="#94a3b8">· Auto-división en partes (~550 car.)</text>
    <rect x="12" y="142" width="256" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="161" font-size="10" font-weight="600" fill="#f59e0b">Sin scrollbar: diapositivas paginadas</text>
  </g>

  <!-- FASE 3: Subtemas / Tarjetas de Hijos -->
  <g transform="translate(650, 742)">
    <rect width="280" height="185" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="12" y="12" width="112" height="20" rx="6" fill="#155e75"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#a5f3fc">Fase 3: Subtemas</text>
    <text x="12" y="52" font-size="12" font-weight="700" fill="#ffffff">Tarjetas de Hijos y Conexiones</text>
    <text x="12" y="72" font-size="10.5" fill="#94a3b8">· Grid responsivo (1 a 3 columnas)</text>
    <text x="12" y="88" font-size="10.5" fill="#94a3b8">· Límite de 6 tarjetas por diapositiva</text>
    <text x="12" y="104" font-size="10.5" fill="#94a3b8">· Clic salta directo al nodo (Jump)</text>
    <text x="12" y="120" font-size="10.5" fill="#94a3b8">· Sección inferior de conectores cruzados</text>
    <rect x="12" y="142" width="256" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="161" font-size="10" font-weight="600" fill="#06b6d4">Botón «Volver» (Backspace) dinámico</text>
  </g>

