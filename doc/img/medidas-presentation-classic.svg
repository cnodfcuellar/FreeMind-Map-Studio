    <text x="838" y="134" font-size="13" font-weight="700" fill="#475569">✕</text>

    <!-- 2. RADAR MINIMAP FLOTANTE (Top Center, y: 118, centrado en x: 490) -->
    <!-- Contenedor translúcido 260 × 48 -->
    <rect x="360" y="116" width="260" height="48" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
    <!-- Lienzo Mini SVG -->
    <rect x="370" y="122" width="170" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
