    <!-- Fila 1 -->
    <rect x="16" y="68" width="358" height="58" rx="8" fill="#0f172a"/>
    <text x="26" y="88" font-size="11.5" font-weight="700" fill="#38bdf8">Layout General (Raíz)</text>
    <text x="26" y="106" font-size="10.5" fill="#cbd5e1">fixed inset-0 · 100vw × 100vh · p-4 (sm:p-6)</text>
    <text x="26" y="120" font-size="9.5" fill="#64748b">flex flex-col justify-between · z-50 overflow-hidden</text>

    <!-- Fila 2 -->
    <rect x="16" y="134" width="358" height="66" rx="8" fill="#0f172a"/>
    <text x="26" y="154" font-size="11.5" font-weight="700" fill="#38bdf8">Cabecera Superior (Header)</text>
    <text x="26" y="172" font-size="10.5" fill="#cbd5e1">Alto 40px (h-10) · flex items-center justify-between</text>
    <text x="26" y="188" font-size="9.5" fill="#64748b">Badge modo (Sparkles) · Badge fase · Botón Editar · X (Esc)</text>

    <!-- Fila 3 -->
    <rect x="16" y="208" width="358" height="76" rx="8" fill="#0f172a"/>
    <text x="26" y="228" font-size="11.5" font-weight="700" fill="#38bdf8">Radar MiniMapa (Flotante Superior)</text>
    <text x="26" y="246" font-size="10.5" fill="#cbd5e1">Posición: fixed top-2 left-1/2 -translate-x-1/2 · z-40</text>
    <text x="26" y="262" font-size="10" fill="#cbd5e1">Lienzo: w-52 (208) sm:w-68 (272) md:w-80 (320px)</text>
    <text x="26" y="276" font-size="9.5" fill="#64748b">Alto: h-14 (56) sm:h-16 (64) md:h-18 (72px) · halo pulsante</text>

    <!-- Fila 4 -->
    <rect x="16" y="292" width="358" height="98" rx="8" fill="#0f172a"/>
    <text x="26" y="312" font-size="11.5" font-weight="700" fill="#38bdf8">Zona Central Diapositiva (Main)</text>
    <text x="26" y="330" font-size="10.5" fill="#cbd5e1">flex-1 · max-w-6xl (1152px) · mx-auto p-2 (sm:p-4)</text>
    <text x="26" y="346" font-size="10" fill="#cbd5e1">Spotlight: max-w-5xl · Imagen S:144, M:240, L:320px</text>
    <text x="26" y="362" font-size="10" fill="#cbd5e1">Notas: max-w-4xl (896px) · p-6 (sm:p-8) · Markdown</text>
    <text x="26" y="378" font-size="9.5" fill="#64748b">Subtemas: max-w-5xl · Grid 3 cols · cards p-4 rounded-2xl</text>

    <!-- Fila 5 -->
    <rect x="16" y="398" width="358" height="74" rx="8" fill="#0f172a"/>
    <text x="26" y="418" font-size="11.5" font-weight="700" fill="#38bdf8">Barra Inferior (Footer)</text>
    <text x="26" y="436" font-size="10.5" fill="#cbd5e1">Alto 48px (h-12) · max-w-4xl (896px) mx-auto</text>
    <text x="26" y="452" font-size="10" fill="#cbd5e1">Botones 32px alto · Anterior/Siguiente (flechas/espacio)</text>
    <text x="26" y="466" font-size="9.5" fill="#64748b">Inicio Tema (Padre) · Siguiente Tema · Dots centrales</text>

    <!-- Fila 6 -->
    <rect x="16" y="480" width="358" height="114" rx="8" fill="#0f172a"/>
    <text x="26" y="500" font-size="11.5" font-weight="700" fill="#38bdf8">Modal de Opciones / Edición (Tecla E)</text>
    <text x="26" y="518" font-size="10.5" fill="#cbd5e1">fixed inset-0 · z-60 · bg-black/60 backdrop-blur-sm</text>
    <text x="26" y="534" font-size="10" fill="#cbd5e1">Contenedor: max-w-xl (576px) · rounded-2xl p-6</text>
    <text x="26" y="550" font-size="10" fill="#cbd5e1">Max-height: max-h-[85vh] overflow-y-auto</text>
    <text x="26" y="566" font-size="9.5" fill="#94a3b8">Grid 4 cols para 8 temas · Switches para notas/subtemas</text>
    <text x="26" y="580" font-size="9.5" fill="#64748b">Selector tamaño imagen · Alineación (Centro/Izq) · Escala texto</text>

    <!-- Fila 7: Atajos de Teclado -->
    <rect x="16" y="602" width="358" height="198" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="622" font-size="11.5" font-weight="700" fill="#f59e0b">Atajos de Teclado en Modo Clásico</text>
    <text x="26" y="642" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Espacio / Flecha Derecha:</tspan> Siguiente diapositiva</text>
    <text x="26" y="660" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Flecha Izquierda:</tspan> Diapositiva anterior</text>
    <text x="26" y="678" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Flecha Arriba:</tspan> Ir al inicio del tema (Padre)</text>
    <text x="26" y="696" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Flecha Abajo:</tspan> Saltar al siguiente tema/rama</text>
    <text x="26" y="714" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Backspace:</tspan> Volver del salto (Return Jump)</text>
    <text x="26" y="732" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Tecla E:</tspan> Abrir modal de configuración</text>
    <text x="26" y="750" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Tecla M:</tspan> Conmutar visibilidad del radar MiniMapa</text>
    <text x="26" y="768" font-size="10" fill="#cbd5e1"><tspan font-weight="700" fill="#ffffff">Escape:</tspan> Salir de la presentación</text>
    <text x="26" y="786" font-size="9" fill="#94a3b8">PresentationMode.tsx:505-548</text>
