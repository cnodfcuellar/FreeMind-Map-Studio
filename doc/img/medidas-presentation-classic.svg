    <circle cx="430" cy="140" r="4" fill="#3b82f6"/>
    <circle cx="470" cy="132" r="3" fill="#64748b"/>
    <circle cx="470" cy="148" r="3" fill="#64748b"/>
    <path d="M434,140 L467,132 M434,140 L467,148" stroke="#94a3b8" stroke-width="1.2"/>
