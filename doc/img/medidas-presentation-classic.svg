<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="960" viewBox="0 0 1380 960" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <defs>
    <marker id="cap" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <style>
      .cota { stroke:#f59e0b; stroke-width:1; }
      .cota-txt { font-size:11px; fill:#b45309; font-weight:700; }
      .lbl { font-size:12px; fill:#334155; font-weight:600; }
      .lbl-sm { font-size:10.5px; fill:#64748b; }
      .area-name { font-size:13px; font-weight:800; }
      .badge-txt { font-size:10.5px; font-weight:700; }
    </style>
  </defs>

  <!-- Fondo General de la Lámina -->
  <rect width="1380" height="960" rx="16" fill="#0f172a"/>
  <text x="36" y="44" font-size="22" font-weight="700" fill="#ffffff">PresentationMode §10 — Modo Presentación Clásica — Medidas detalladas</text>
  <text x="36" y="68" font-size="12.5" fill="#93c5fd">Escala 1:1 · PresentationMode.tsx:604-1606 · Overlay pantalla completa (100vw × 100vh) · Pila flex col + HUD flotante</text>

  <!-- ========================================================================= -->
  <!-- VISTA WIREFRAME DE LA PANTALLA COMPLETA A ESCALA (880 × 580 px, y: 110)   -->
  <!-- ========================================================================= -->
  <g id="screen-wireframe">
    <!-- Marco de pantalla (100vw × 100vh simulado) -->
    <rect x="50" y="110" width="880" height="580" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- 1. HEADER (Top Bar) alto 40px -->
    <rect x="50" y="110" width="880" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Badges Izquierda -->
    <rect x="66" y="117" width="168" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="76" y="134" class="badge-txt" fill="#1d4ed8">✦ Modo Presentación Clásica</text>

    <rect x="242" y="118" width="118" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="250" y="134" font-size="10" font-weight="700" fill="#1d4ed8">📖 Tema Principal (1/1)</text>

    <!-- Acciones Derecha -->
    <rect x="686" y="116" width="70" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
