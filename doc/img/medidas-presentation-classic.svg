    <rect x="110" y="190" width="760" height="350" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="6 4"/>
    
    <!-- Breadcrumb -->
    <text x="490" y="235" font-size="12" fill="#64748b" text-anchor="middle">Mapa Central → Estrategia 2026</text>

    <!-- Título Principal -->
    <text x="490" y="280" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Estrategia de Crecimiento Q1-Q4</text>

    <!-- Cuerpo del Nodo -->
    <text x="490" y="325" font-size="15" fill="#475569" text-anchor="middle">Plan detallado de expansión operativa y consolidación de mercado.</text>
    <text x="490" y="348" font-size="15" fill="#475569" text-anchor="middle">Metas clave de producto con enfoque offline y máxima estabilidad.</text>

    <!-- Badges Tags y Progreso -->
    <rect x="360" y="380" width="110" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="415" y="397" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Progreso: 85%</text>

    <rect x="480" y="380" width="75" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="517" y="397" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">#roadmap</text>

    <rect x="565" y="380" width="60" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="595" y="397" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">#core</text>

    <!-- 4. FOOTER (Bottom Navigation Bar) h-12 = 48px en y: 642 -->
    <rect x="50" y="642" width="880" height="48" fill="#ffffff" stroke="#e2e8f0"/>
    
    <!-- Botones Izquierda: Anterior + Inicio de Tema -->
    <rect x="70" y="650" width="82" height="32" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="670" font-size="11" font-weight="700" fill="#475569">◀ Anterior</text>

    <rect x="160" y="650" width="128" height="32" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="172" y="670" font-size="11" font-weight="700" fill="#1d4ed8">⮤ Inicio: Raíz</text>

    <!-- Paginador Central (Dots de diapositivas) -->
    <circle cx="465" cy="666" r="3.5" fill="#94a3b8"/>
    <rect x="476" y="663" width="22" height="7" rx="3.5" fill="#2563eb"/>
    <circle cx="507" cy="666" r="3.5" fill="#94a3b8"/>
    <circle cx="519" cy="666" r="3.5" fill="#94a3b8"/>
    <circle cx="531" cy="666" r="3.5" fill="#94a3b8"/>

    <!-- Botones Derecha: Siguiente Tema + Siguiente -->
    <rect x="670" y="650" width="120" height="32" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="682" y="670" font-size="11" font-weight="700" fill="#7e22ce">Siguiente Tema ⏭</text>

    <rect x="800" y="650" width="94" height="32" rx="10" fill="#2563eb"/>
    <text x="814" y="670" font-size="11" font-weight="700" fill="#ffffff">Siguiente ▶</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COTAS Y GUÍAS VERTICALES DE LA PANTALLA PRINCIPAL                        -->
  <!-- ========================================================================= -->
  <!-- Cota Alto Pantalla 100vh = 580px (x=30) -->
  <line x1="30" y1="110" x2="30" y2="690" class="cota"/>
  <line x1="24" y1="110" x2="36" y2="110" class="cota"/>
  <line x1="24" y1="690" x2="36" y2="690" class="cota"/>
  <text x="18" y="405" class="cota-txt" text-anchor="middle" transform="rotate(-90 18 405)">100vh (h-screen)</text>

  <!-- Cota Header h-10 = 40px (x=942) -->
  <line x1="942" y1="110" x2="942" y2="150" class="cota"/>
  <line x1="936" y1="110" x2="948" y2="110" class="cota"/>
  <line x1="936" y1="150" x2="948" y2="150" class="cota"/>
  <text x="955" y="134" class="cota-txt">40px (h-10)</text>

  <!-- Cota Canvas Central flex-1 (x=942) -->
  <line x1="942" y1="150" x2="942" y2="642" class="cota"/>
  <line x1="936" y1="150" x2="948" y2="150" class="cota"/>
  <line x1="936" y1="642" x2="948" y2="642" class="cota"/>
  <text x="955" y="400" class="cota-txt">flex-1 (max-w-6xl = 1152px)</text>

  <!-- Cota Footer h-12 = 48px (x=942) -->
  <line x1="942" y1="642" x2="942" y2="690" class="cota"/>
  <line x1="936" y1="642" x2="948" y2="642" class="cota"/>
  <line x1="936" y1="690" x2="948" y2="690" class="cota"/>
  <text x="955" y="670" class="cota-txt">48px (h-12)</text>

  <!-- Cota Radar MiniMapa (x=490, arriba) -->
  <line x1="360" y1="98" x2="620" y2="98" class="cota"/>
  <line x1="360" y1="92" x2="360" y2="104" class="cota"/>
  <line x1="620" y1="92" x2="620" y2="104" class="cota"/>
  <text x="490" y="93" class="cota-txt" text-anchor="middle">MiniMapa Radar: w-52..w-80 (208..320px) × h-14..h-18 (56..72px)</text>

