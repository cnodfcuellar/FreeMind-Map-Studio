  <text x="456" y="352" class="body">Card: space-y-1.5 bg-blue-50/60 p-2.5 rounded-xl border-blue-200/80 shadow-2xs</text>
  <text x="456" y="374" class="body">Fila: "Iconos Asignados" text-[11px] font-semibold blue-900 + "Quitar todos" text-[10px] blue-600 hover:underline (borra todos)</text>
  <text x="456" y="396" class="body">Chips: flex flex-wrap gap-1.5 pt-0.5 · cada chip inline-flex gap-1 bg-white border-blue-200 px-2 py-1 rounded-lg text-xs shadow-2xs</text>
  <text x="456" y="418" class="body">Contenido del chip: renderNodeIcon(iconId, 'w-3.5 h-3.5', iconColor) (14px) + botón X w-3 h-3 (12px) ml-0.5 hover:text-red-500</text>
  <text x="456" y="440" class="body">Clic en icono del grid: toggle (añade/quita de icons[]) · X del chip: quita ese icono · handlers: handleToggleIcon (66-72) / handleRemoveIcon (74-79)</text>
