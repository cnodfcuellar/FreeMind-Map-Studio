  <text x="456" y="208" class="body">Colores: #ef4444 Rojo · #f59e0b Ámbar · #10b981 Verde · #3b82f6 Azul · #8b5cf6 Púrpura · #ec4899 Rosa · #475569 Pizarra</text>
  <text x="456" y="230" class="body">"Original" (text-[10px] underline ml-auto): solo si iconColor está definido · overflow-x-auto</text>
