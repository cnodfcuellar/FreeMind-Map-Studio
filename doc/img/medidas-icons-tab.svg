  <text x="456" y="274" class="body">Propagación (156-178): label text-[10.5px] + grid grid-cols-2 gap-1.5 — "Copiar a Hijos" (azul) / "Copiar a Hermanos" (gris)</text>

  <text x="440" y="318" class="lbl" fill="#93c5fd">Iconos Asignados — card condicional (solo si icons.length &gt; 0) · IconsTab:183-213</text>
