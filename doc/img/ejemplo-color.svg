    <rect x="282" y="128" width="30" height="30" rx="6" fill="#ecfeff" stroke="#e2e8f0"/>
    <rect x="44" y="162" width="30" height="30" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
