  <!-- bg type button ejemplo -->
  <text x="24" y="258" font-size="16" font-weight="800" fill="#0f172a">Botón tipo de fondo — Degradado</text>
  <rect x="24" y="272" width="110" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
