  <rect x="57" y="284" width="44" height="44" rx="8" fill="url(#g2)"/>
  <text x="79" y="348" font-size="10" text-anchor="middle" fill="#1d4ed8" font-weight="600">Degradado</text>
  <text x="150" y="310" font-size="11" fill="#64748b">p-2 rounded-xl border</text>
  <text x="150" y="328" font-size="11" fill="#64748b">sel: border-blue-600</text>
  <text x="150" y="346" font-size="11" fill="#64748b">bg-blue-50/80</text>
