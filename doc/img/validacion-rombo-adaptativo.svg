<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Header -->
  <rect x="30" y="24" width="1020" height="60" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="50" y="58" font-size="18" font-weight="700" fill="#f8fafc">◇ Rombo Adaptativo — Validación Visual de Geometría</text>
  <text x="50" y="74" font-size="12" fill="#94a3b8">Texto 100% dentro, ceñido al contenido, centrado y sin espacio desperdiciado (proporción horizontal ~1.55:1)</text>

  <!-- Card 1: ¿Es viable? -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="310" height="260" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="20" y="32" font-size="13" font-weight="700" fill="#38bdf8">1. Nodo Simple (Decisión)</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">Texto: "¿Es viable?" • 176x114px</text>
    
    <!-- Connector line -->
    <line x1="20" y1="137.0" x2="65" y2="137.0" stroke="#3b82f6" stroke-width="2.5" />
    
    <g transform="translate(65, 80)">
      <path d="M 78.0,11.0 Q 88.0,1.0 98.0,11.0 L 165.0,47.0 Q 175.0,57.0 165.0,67.0 L 98.0,103.0 Q 88.0,113.0 78.0,103.0 L 11.0,67.0 Q 1.0,57.0 11.0,47.0 Z" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
      <!-- Fold button -->
      <circle cx="176" cy="57.0" r="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="176" y="60.0" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
      <!-- Centered Text -->
      <text x="88.0" y="62.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">¿Es viable?</text>
    </g>
    <text x="20" y="240" font-size="11" fill="#4ade80">✔ 100% dentro • 0 desborde • Centrado</text>
  </g>

  <!-- Card 2: Solo Título -->
  <g transform="translate(385, 110)">
    <rect x="0" y="0" width="310" height="260" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="20" y="32" font-size="13" font-weight="700" fill="#38bdf8">2. Título Central (Sin Cuerpo)</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">Texto: "Idea Central" • 215x139px</text>

    <!-- Connector line -->
    <line x1="15" y1="139.5" x2="45" y2="139.5" stroke="#3b82f6" stroke-width="2.5" />

    <g transform="translate(45, 70)">
      <path d="M 95.5,13.0 Q 107.5,1.0 119.5,13.0 L 202.0,57.5 Q 214.0,69.5 202.0,81.5 L 119.5,126.0 Q 107.5,138.0 95.5,126.0 L 13.0,81.5 Q 1.0,69.5 13.0,57.5 Z" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
      <!-- Fold button -->
      <circle cx="215" cy="69.5" r="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="215" y="72.5" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
      <!-- Centered Text -->
      <text x="107.5" y="74.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Idea Central</text>
    </g>
    <text x="20" y="240" font-size="11" fill="#4ade80">✔ Proporción armónica • Sin huecos</text>
  </g>

  <!-- Card 3: Comparativa con el Cometa Cuadrado 1:1 -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="310" height="260" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="20" y="32" font-size="13" font-weight="700" fill="#f87171">Comparativa de Área</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">Mismo contenido en ambos modos</text>

    <!-- Silueta Cuadrado 1:1 antiguo (320x320) -->
    <g transform="translate(155, 140)">
      <rect x="-45" y="-45" width="90" height="90" rx="8" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(45)" />
      <text x="0" y="-55" font-size="9" fill="#ef4444" text-anchor="middle">Cometa 1:1 (Gigante)</text>

      <!-- Rombo adaptativo nuevo -->
      <path d="M 49.0,7.0 Q 55.0,1.0 61.0,7.0 L 103.0,29.5 Q 109.0,35.5 103.0,41.5 L 61.0,64.0 Q 55.0,70.0 49.0,64.0 L 7.0,41.5 Q 1.0,35.5 7.0,29.5 Z" transform="translate(-55, -35.5)" fill="rgba(37,99,235,0.7)" stroke="#60a5fa" stroke-width="1.5" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Idea Central</text>
    </g>

    <text x="20" y="222" font-size="11" fill="#cbd5e1">• Cometa 1:1: 80% espacio azul muerto</text>
    <text x="20" y="240" font-size="11" fill="#4ade80">• Rombo adaptativo: -55% área desperdiciada</text>
  </g>

  <!-- Card 4: Caso Completo Multilínea del Usuario -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="1000" height="305" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="24" y="34" font-size="14" font-weight="700" fill="#38bdf8">3. Caso Crítico del Usuario: Título + Cuerpo Multilínea (4 líneas de explicación)</text>
    <text x="24" y="54" font-size="12" fill="#94a3b8">Demuestra que el texto extenso queda completamente dentro, centrado, ceñido y con margen de seguridad respecto a los vértices (390x252px)</text>

    <!-- Connector line -->
    <line x1="20" y1="201.0" x2="290" y2="201.0" stroke="#3b82f6" stroke-width="3" />

    <g transform="translate(290, 75)">
      <path d="M 181.0,15.0 Q 195.0,1.0 209.0,15.0 L 375.0,112.0 Q 389.0,126.0 375.0,140.0 L 209.0,237.0 Q 195.0,251.0 181.0,237.0 L 15.0,140.0 Q 1.0,126.0 15.0,112.0 Z" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow)" />
      <!-- Fold button -->
      <circle cx="390" cy="126.0" r="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
      <text x="390" y="130.0" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
      
      <!-- Text Container (max 65% width = 250px centered) -->
      <g transform="translate(195.0, 48)">
        <text x="0" y="24" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Idea Central</text>
        <line x1="-100" y1="36" x2="100" y2="36" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
        <text x="0" y="56" font-size="12.5" fill="rgba(255,255,255,0.92)" text-anchor="middle">Tema principal de tu mapa mental.</text>
        <text x="0" y="74" font-size="12.5" fill="rgba(255,255,255,0.92)" text-anchor="middle">Puedes editar el título y esta explicación</text>
        <text x="0" y="92" font-size="12.5" fill="rgba(255,255,255,0.92)" text-anchor="middle">desde el panel de propiedades (Alt+P)</text>
        <text x="0" y="110" font-size="12.5" fill="rgba(255,255,255,0.92)" text-anchor="middle">o con doble clic.</text>
      </g>
    </g>

    <text x="730" y="150" font-size="12" font-weight="600" fill="#4ade80">✔ Texto 100% dentro</text>
    <text x="730" y="172" font-size="11" fill="#cbd5e1">• Vértice superior: 48px de colchón</text>
    <text x="730" y="190" font-size="11" fill="#cbd5e1">• Vértice inferior: 50px de colchón</text>
    <text x="730" y="208" font-size="11" fill="#cbd5e1">• Laterales: 70px a conectores</text>
    <text x="730" y="226" font-size="11" fill="#cbd5e1">• Cero desborde en esquinas</text>
    <text x="730" y="244" font-size="11" fill="#38bdf8">• Proporción 1.55:1 óptima</text>
  </g>
</svg>