  <text x="456" y="350" class="body">Icono: caja w-6 h-6 (24x24) rounded-lg bg-blue-100 text-blue-700 + icono w-3.5 h-3.5 (14px) · gap-2 (8px)</text>
  <text x="456" y="372" class="body">Título text-xs font-semibold slate-800 truncate · Subtítulo text-[10px] slate-400 truncate</text>
  <text x="456" y="394" class="body">Chevron: p-0.5 + w-4 h-4 (16px) · abierto rotate-0 (apunta ↓) / cerrado -rotate-90 (apunta →) · duration-200</text>
  <text x="456" y="416" class="body">Body abierto: px-3.5 pb-3.5 pt-1 (14/14/4) · space-y-2.5 (10px) · border-t border-slate-200/60 · animate-in fade-in</text>
  <text x="456" y="438" class="body">Estado inicial: {shape: true, fill: false, border: false} · "Desplegar/Plegar todo" sincroniza las 3</text>

  <text x="440" y="474" class="lbl" fill="#93c5fd">Átomos de control — SliderInput.tsx y ColorPicker.tsx (reutilizados en otras pestañas)</text>
