  <text x="456" y="526" class="body">space-y-1.5 (6px) · fila text-xs: label font-medium slate-700 + badge text-[11px] font-semibold blue-600 bg-blue-50 px-1.5 py-0.5 ("{value}{unit}") + Reset text-[10px]</text>
  <text x="456" y="546" class="body">input range: w-full h-1.5 (6px alto) bg-slate-200 rounded-lg accent-blue-600 · alto total ~30px</text>
  <text x="456" y="576" font-size="11" font-weight="700" fill="#334155">ColorPicker</text>
  <text x="456" y="596" class="body">space-y-1.5 · fila text-xs + caja (gap-1 border rounded px-1.5 py-0.5 shadow-2xs): input color w-4 h-4 (16px) + valor font-mono text-[10px] uppercase</text>
  <text x="456" y="616" class="body">El valor mostrado es el color COMPLETO del nodo: hex (#38B2F6) o rgba(...) con alfa — "Auto" si está vacío</text>
  <text x="456" y="636" class="body">presets: grid grid-cols-8 gap-1 pt-0.5 — 16 colores aspect-square rounded-md (~31px) hover:scale-110 · seleccionado: border-blue-600 ring-2 ring-blue-400</text>

  <text x="440" y="688" class="lbl" fill="#93c5fd">Contenido de las secciones (expandidos a la izquierda, a escala 1:1)</text>
