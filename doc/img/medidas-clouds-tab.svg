  <text x="456" y="720" class="body">Forma y Márgenes (152-204): grid grid-cols-4 gap-1.5 (6px) — 8 formas, celda ~64x48px · botón p-2 rounded-xl border icono 16px label text-[9.5px] mt-1</text>
  <text x="456" y="742" class="body">Divisor: pt-2 border-t border-slate-200/80 space-y-3 · sliders Margen H/V (min -50 · max 200 · step 5 · px) con Reset (undefined)</text>
  <text x="456" y="764" class="body">Relleno (207-230): ColorPicker "Color de Nube" + SliderInput "Opacidad de Fondo" — badge muestra % · onChange escribe opacity = op / 100</text>
  <text x="456" y="786" class="body">Presets: fila 1 = blancos/pasteles claros · fila 2 = 8 saturados (orden DEFAULT_PRESETS:13-16) · celda ~31x31px (gap-1)</text>
  <text x="456" y="808" class="body">Borde y Sombra (233-283): ColorPicker "Color de Borde" + SliderInput "Grosor de Borde" (0..6 step 0.5 px, default 1.5)</text>
  <text x="456" y="830" class="body">"Estilo de Línea": text-[11px] font-semibold block + grid grid-cols-3 gap-1.5 (6px) — 3 botones, celda ~88x48px, p-2 rounded-xl border</text>
  <text x="456" y="852" class="body">Cada botón de línea: muestra w-8 border-t-2 my-1 (32px, border-current solid/dashed/dotted) + label text-[10px] · default dashed</text>
  <text x="456" y="874" class="body">Seleccionado: border-blue-600 bg-blue-50/80 text-blue-700 font-semibold shadow-2xs (mismo estilo que los botones de forma)</text>
  <text x="456" y="896" class="body">Valores reales (captura del usuario): Color de Nube = RGBA(168, 255, 247, 0.08) · Color de Borde = #38B2F6 · Grosor 1.5px · Opacidad 8%</text>
  <text x="456" y="918" class="body">El selector de color muestra el color completo del nodo (hex o rgba con alfa), no solo hex</text>
  <text x="456" y="940" class="body">Todos los cambios: updateCloudProps → onUpdateNode(cloud, enabled: true) · se guardan en el nodo (persistencia vía store)</text>
  <text x="456" y="962" class="body">bgType ('color') se fija en los defaults pero la pestaña NO ofrece selector de tipo (sin gradiente/imagen para nubes)</text>
</svg>
